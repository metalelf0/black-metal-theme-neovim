# name: MARDUK colors for Lazygit
# url: https://github.com/jesseduffield/lazygit
# upstream: https://github.com/metalelf0/black-metal.nvim/raw/main/extras/lazygit/marduk.yml
# author: Andrea Schiavini (original code by Casey Miller)

gui:
  theme:
    activeBorderColor:
      - "#5f8787"
      - bold
    inactiveBorderColor:
      - "#505050"
    optionsTextColor:
      - "#a5aaa7"
    selectedLineBgColor:
      - "#222222"
    cherryPickedCommitBgColor:
      - "#222222"
    cherryPickedCommitFgColor:
      - "#5f8787"
    unstagedChangesColor:
      - "#5f8787"
    defaultFgColor:
      - "#f1f1f1"
    searchingActiveBorderColor:
      - "#aaaaaa"
  commitColors:
    "♥": "#5f8787"
    "↻": "#888888"
    "~": "#aaaaaa"
    "→": "#f1f1f1"
    "☀": "#aaaaaa"
    "✗": "#626b67"
    "⚑": "#a5aaa7"
    "▼": "#999999"
    "▲": "#f1f1f1"
    "M": "#aaaaaa"
