# name: MARDUK LIGHT ALT colors for Lazygit
# url: https://github.com/jesseduffield/lazygit
# upstream: https://github.com/metalelf0/black-metal.nvim/raw/main/extras/lazygit/marduk-light-alt.yml
# author: Andrea Schiavini (original code by Casey Miller)

gui:
  theme:
    activeBorderColor:
      - "#63365b"
      - bold
    inactiveBorderColor:
      - "#445a58"
    optionsTextColor:
      - "#4b5950"
    selectedLineBgColor:
      - "#bcd2ce"
    cherryPickedCommitBgColor:
      - "#bcd2ce"
    cherryPickedCommitFgColor:
      - "#63365b"
    unstagedChangesColor:
      - "#a13b3b"
    defaultFgColor:
      - "#0e1a19"
    searchingActiveBorderColor:
      - "#2f6129"
  commitColors:
    "♥": "#a13b3b"
    "↻": "#296047"
    "~": "#2c5e5d"
    "→": "#0e1a19"
    "☀": "#2f6129"
    "✗": "#495b52"
    "⚑": "#4b5950"
    "▼": "#265e3c"
    "▲": "#0e1a19"
    "M": "#2f6129"
