# name: MAYHEM ALT colors for Lazygit
# url: https://github.com/jesseduffield/lazygit
# upstream: https://github.com/metalelf0/black-metal.nvim/raw/main/extras/lazygit/mayhem-alt.yml
# author: Andrea Schiavini (original code by Casey Miller)

gui:
  theme:
    activeBorderColor:
      - "#5f8787"
      - bold
    inactiveBorderColor:
      - "#505050"
    optionsTextColor:
      - "#f3ecd4"
    selectedLineBgColor:
      - "#222222"
    cherryPickedCommitBgColor:
      - "#222222"
    cherryPickedCommitFgColor:
      - "#5f8787"
    unstagedChangesColor:
      - "#5f8787"
    defaultFgColor:
      - "#f1f1f1"
    searchingActiveBorderColor:
      - "#aaaaaa"
  commitColors:
    "♥": "#5f8787"
    "↻": "#888888"
    "~": "#aaaaaa"
    "→": "#c1c1c1"
    "☀": "#aaaaaa"
    "✗": "#eecc6c"
    "⚑": "#f3ecd4"
    "▼": "#999999"
    "▲": "#c1c1c1"
    "M": "#aaaaaa"
