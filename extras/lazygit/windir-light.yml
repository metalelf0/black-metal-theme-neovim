# name: WINDIR LIGHT colors for Lazygit
# url: https://github.com/jesseduffield/lazygit
# upstream: https://github.com/metalelf0/black-metal.nvim/raw/main/extras/lazygit/windir-light.yml
# author: Andrea Schiavini (original code by Casey Miller)

gui:
  theme:
    activeBorderColor:
      - "#634436"
      - bold
    inactiveBorderColor:
      - "#506049"
    optionsTextColor:
      - "#5e5e12"
    selectedLineBgColor:
      - "#c3e3b0"
    cherryPickedCommitBgColor:
      - "#c3e3b0"
    cherryPickedCommitFgColor:
      - "#634436"
    unstagedChangesColor:
      - "#a13b3b"
    defaultFgColor:
      - "#172112"
    searchingActiveBorderColor:
      - "#735431"
  commitColors:
    "♥": "#a13b3b"
    "↻": "#344d79"
    "~": "#423b7d"
    "→": "#172112"
    "☀": "#735431"
    "✗": "#3e5b8e"
    "⚑": "#5e5e12"
    "▼": "#5e5e26"
    "▲": "#172112"
    "M": "#735431"
