# name: NILE LIGHT ALT colors for Lazygit
# url: https://github.com/jesseduffield/lazygit
# upstream: https://github.com/metalelf0/black-metal.nvim/raw/main/extras/lazygit/nile-light-alt.yml
# author: Andrea Schiavini (original code by Casey Miller)

gui:
  theme:
    activeBorderColor:
      - "#364563"
      - bold
    inactiveBorderColor:
      - "#5d5346"
    optionsTextColor:
      - "#634f3a"
    selectedLineBgColor:
      - "#CBB48C"
    cherryPickedCommitBgColor:
      - "#CBB48C"
    cherryPickedCommitFgColor:
      - "#364563"
    unstagedChangesColor:
      - "#a13b3b"
    defaultFgColor:
      - "#17130d"
    searchingActiveBorderColor:
      - "#813a37"
  commitColors:
    "♥": "#a13b3b"
    "↻": "#555525"
    "~": "#445a2b"
    "→": "#17130d"
    "☀": "#813a37"
    "✗": "#565633"
    "⚑": "#634f3a"
    "▼": "#6c4e2c"
    "▲": "#17130d"
    "M": "#813a37"
