# name: IMMORTAL LIGHT ALT colors for Lazygit
# url: https://github.com/jesseduffield/lazygit
# upstream: https://github.com/metalelf0/black-metal.nvim/raw/main/extras/lazygit/immortal-light-alt.yml
# author: Andrea Schiavini (original code by Casey Miller)

gui:
  theme:
    activeBorderColor:
      - "#633d36"
      - bold
    inactiveBorderColor:
      - "#4d5b66"
    optionsTextColor:
      - "#315c87"
    selectedLineBgColor:
      - "#A8C2CB"
    cherryPickedCommitBgColor:
      - "#A8C2CB"
    cherryPickedCommitFgColor:
      - "#633d36"
    unstagedChangesColor:
      - "#a13b3b"
    defaultFgColor:
      - "#121b21"
    searchingActiveBorderColor:
      - "#2b6264"
  commitColors:
    "♥": "#a13b3b"
    "↻": "#345779"
    "~": "#3b3e7d"
    "→": "#121b21"
    "☀": "#2b6264"
    "✗": "#445c73"
    "⚑": "#315c87"
    "▼": "#32577b"
    "▲": "#121b21"
    "M": "#2b6264"
