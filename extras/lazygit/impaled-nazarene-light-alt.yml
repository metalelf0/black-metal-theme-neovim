# name: IMPALED-NAZARENE LIGHT ALT colors for Lazygit
# url: https://github.com/jesseduffield/lazygit
# upstream: https://github.com/metalelf0/black-metal.nvim/raw/main/extras/lazygit/impaled-nazarene-light-alt.yml
# author: Andrea Schiavini (original code by Casey Miller)

gui:
  theme:
    activeBorderColor:
      - "#365063"
      - bold
    inactiveBorderColor:
      - "#61664d"
    optionsTextColor:
      - "#c30c03"
    selectedLineBgColor:
      - "#e2ebad"
    cherryPickedCommitBgColor:
      - "#e2ebad"
    cherryPickedCommitFgColor:
      - "#365063"
    unstagedChangesColor:
      - "#a13b3b"
    defaultFgColor:
      - "#1f2112"
    searchingActiveBorderColor:
      - "#813756"
  commitColors:
    "♥": "#a13b3b"
    "↻": "#6e602f"
    "~": "#5c6831"
    "→": "#1f2112"
    "☀": "#813756"
    "✗": "#755f1a"
    "⚑": "#c30c03"
    "▼": "#7b3632"
    "▲": "#1f2112"
    "M": "#813756"
