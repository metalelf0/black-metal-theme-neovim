# name: KHOLD LIGHT ALT colors for Lazygit
# url: https://github.com/jesseduffield/lazygit
# upstream: https://github.com/metalelf0/black-metal.nvim/raw/main/extras/lazygit/khold-light-alt.yml
# author: Andrea Schiavini (original code by Casey Miller)

gui:
  theme:
    activeBorderColor:
      - "#31594e"
      - bold
    inactiveBorderColor:
      - "#664d52"
    optionsTextColor:
      - "#4f5729"
    selectedLineBgColor:
      - "#CD9FA9"
    cherryPickedCommitBgColor:
      - "#CD9FA9"
    cherryPickedCommitFgColor:
      - "#31594e"
    unstagedChangesColor:
      - "#a13b3b"
    defaultFgColor:
      - "#1e1013"
    searchingActiveBorderColor:
      - "#615029"
  commitColors:
    "♥": "#a13b3b"
    "↻": "#793834"
    "~": "#684e31"
    "→": "#1e1013"
    "☀": "#615029"
    "✗": "#8f342e"
    "⚑": "#4f5729"
    "▼": "#4e5723"
    "▲": "#1e1013"
    "M": "#615029"
