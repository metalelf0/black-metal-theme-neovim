# name: THYRFING LIGHT colors for Lazygit
# url: https://github.com/jesseduffield/lazygit
# upstream: https://github.com/metalelf0/black-metal.nvim/raw/main/extras/lazygit/thyrfing-light.yml
# author: Andrea Schiavini (original code by Casey Miller)

gui:
  theme:
    activeBorderColor:
      - "#2f5651"
      - bold
    inactiveBorderColor:
      - "#634e4b"
    optionsTextColor:
      - "#99270a"
    selectedLineBgColor:
      - "#efb9b3"
    cherryPickedCommitBgColor:
      - "#efb9b3"
    cherryPickedCommitFgColor:
      - "#2f5651"
    unstagedChangesColor:
      - "#a13b3b"
    defaultFgColor:
      - "#170e0d"
    searchingActiveBorderColor:
      - "#81374a"
  commitColors:
    "♥": "#a13b3b"
    "↻": "#794134"
    "~": "#614f2e"
    "→": "#170e0d"
    "☀": "#81374a"
    "✗": "#912f18"
    "⚑": "#99270a"
    "▼": "#7b4132"
    "▲": "#170e0d"
    "M": "#81374a"
