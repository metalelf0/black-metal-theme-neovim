# name: TAAKE LIGHT colors for Lazygit
# url: https://github.com/jesseduffield/lazygit
# upstream: https://github.com/metalelf0/black-metal.nvim/raw/main/extras/lazygit/taake-light.yml
# author: Andrea Schiavini (original code by Casey Miller)

gui:
  theme:
    activeBorderColor:
      - "#2d4f52"
      - bold
    inactiveBorderColor:
      - "#5d4658"
    optionsTextColor:
      - "#514733"
    selectedLineBgColor:
      - "#d4b5cd"
    cherryPickedCommitBgColor:
      - "#d4b5cd"
    cherryPickedCommitFgColor:
      - "#2d4f52"
    unstagedChangesColor:
      - "#a13b3b"
    defaultFgColor:
      - "#030203"
    searchingActiveBorderColor:
      - "#6f3c2f"
  commitColors:
    "♥": "#a13b3b"
    "↻": "#64432b"
    "~": "#504b26"
    "→": "#030203"
    "☀": "#6f3c2f"
    "✗": "#57483d"
    "⚑": "#514733"
    "▼": "#5a4925"
    "▲": "#030203"
    "M": "#6f3c2f"
