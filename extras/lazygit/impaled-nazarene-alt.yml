# name: IMPALED-NAZARENE ALT colors for Lazygit
# url: https://github.com/jesseduffield/lazygit
# upstream: https://github.com/metalelf0/black-metal.nvim/raw/main/extras/lazygit/impaled-nazarene-alt.yml
# author: Andrea Schiavini (original code by Casey Miller)

gui:
  theme:
    activeBorderColor:
      - "#5f8787"
      - bold
    inactiveBorderColor:
      - "#505050"
    optionsTextColor:
      - "#DC2A22"
    selectedLineBgColor:
      - "#373737"
    cherryPickedCommitBgColor:
      - "#373737"
    cherryPickedCommitFgColor:
      - "#5f8787"
    unstagedChangesColor:
      - "#5f8787"
    defaultFgColor:
      - "#f1f1f1"
    searchingActiveBorderColor:
      - "#aaaaaa"
  commitColors:
    "♥": "#5f8787"
    "↻": "#888888"
    "~": "#aaaaaa"
    "→": "#c1c1c1"
    "☀": "#aaaaaa"
    "✗": "#B29740"
    "⚑": "#DC2A22"
    "▼": "#999999"
    "▲": "#c1c1c1"
    "M": "#aaaaaa"
