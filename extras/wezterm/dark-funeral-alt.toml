[colors]
foreground = "#f1f1f1"
background = "#060f23"
# background = "#060f23" # alternate, darker bg
cursor_bg = "#f1f1f1"
cursor_border = "#f1f1f1"
cursor_fg = "#060f23"
selection_bg = "#2E2E2E"
selection_fg = "#f1f1f1"
split = "#505050"
compose_cursor = "#aaaaaa"
scrollbar_thumb = "#505050"

ansi = ["#060f23", "#5f8787", "#c1c1c1", "#888888", "#aaaaaa", "#999999", "#fbcb97", "#f1f1f1"]
brights = ["#505050", "#5f8787", "#c1c1c1", "#888888", "#aaaaaa", "#d0dfee", "#fbcb97", "#f1f1f1"]

[colors.tab_bar]
inactive_tab_edge = "#505050"
background = "#060f23"

[colors.tab_bar.active_tab]
fg_color = "#5f8787"
bg_color = "#2E2E2E"

[colors.tab_bar.inactive_tab]
fg_color = "#505050"
bg_color = "#060f23"

[colors.tab_bar.inactive_tab_hover]
fg_color = "#505050"
bg_color = "#060f23"
# intensity = "Bold"

[colors.tab_bar.new_tab_hover]
fg_color = "#5f8787"
bg_color = "#2E2E2E"
intensity = "Bold"

[colors.tab_bar.new_tab]
fg_color = "#5f8787"
bg_color = "#060f23"

