[colors.tab_bar.inactive_tab_hover]
fg_color = "#505050"
bg_color = "#000000"
# intensity = "Bold"

[colors.tab_bar.new_tab_hover]
fg_color = "#5f8787"
bg_color = "#222222"
intensity = "Bold"

[colors.tab_bar.new_tab]
fg_color = "#5f8787"
bg_color = "#000000"

