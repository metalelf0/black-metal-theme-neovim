[colors]
foreground = "#f1f1f1"
background = "#000000"
# background = "#301807" # alternate, darker bg
cursor_bg = "#f1f1f1"
cursor_border = "#f1f1f1"
cursor_fg = "#000000"
selection_bg = "#222222"
selection_fg = "#f1f1f1"
split = "#505050"
compose_cursor = "#aaaaaa"
scrollbar_thumb = "#505050"

ansi = ["#301807", "#5f8787", "#c1c1c1", "#888888", "#aaaaaa", "#999999", "#aa9988", "#f1f1f1"]
brights = ["#505050", "#5f8787", "#c1c1c1", "#888888", "#aaaaaa", "#777755", "#aa9988", "#f1f1f1"]

[colors.tab_bar]
