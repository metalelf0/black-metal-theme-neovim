[colors]
foreground = "#211212"
background = "#ddcacc"
# background = "#ddcacc" # alternate, darker bg
cursor_bg = "#211212"
cursor_border = "#211212"
cursor_fg = "#ddcacc"
selection_bg = "#BAAFAF"
selection_fg = "#211212"
split = "#6c5151"
compose_cursor = "#764b32"
scrollbar_thumb = "#6c5151"

ansi = ["#ddcacc", "#a13b3b", "#211212", "#793534", "#6f5034", "#5e5526", "#5e5527", "#211212"]
brights = ["#6c5151", "#a13b3b", "#211212", "#793534", "#6f5034", "#ae0200", "#5e5527", "#211212"]

[colors.tab_bar]
