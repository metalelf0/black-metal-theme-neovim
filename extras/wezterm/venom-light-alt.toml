[colors.tab_bar.inactive_tab_hover]
fg_color = "#6c5151"
bg_color = "#ddcacc"
# intensity = "Bold"

[colors.tab_bar.new_tab_hover]
fg_color = "#325c4f"
bg_color = "#BAAFAF"
intensity = "Bold"

[colors.tab_bar.new_tab]
fg_color = "#325c4f"
bg_color = "#ddcacc"

