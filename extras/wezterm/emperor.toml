[colors]
foreground = "#f1f1f1"
background = "#000000"
# background = "#20173B" # alternate, darker bg
cursor_bg = "#f1f1f1"
cursor_border = "#f1f1f1"
cursor_fg = "#000000"
selection_bg = "#222222"
selection_fg = "#f1f1f1"
split = "#505050"
compose_cursor = "#aaaaaa"
scrollbar_thumb = "#505050"

ansi = ["#20173B", "#5f8787", "#c1c1c1", "#888888", "#aaaaaa", "#999999", "#756482", "#f1f1f1"]
