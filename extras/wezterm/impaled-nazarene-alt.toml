[colors]
foreground = "#f1f1f1"
background = "#191A11"
# background = "#191A11" # alternate, darker bg
cursor_bg = "#f1f1f1"
cursor_border = "#f1f1f1"
cursor_fg = "#191A11"
selection_bg = "#222222"
selection_fg = "#f1f1f1"
split = "#505050"
compose_cursor = "#aaaaaa"
scrollbar_thumb = "#505050"

ansi = ["#191A11", "#5f8787", "#c1c1c1", "#888888", "#aaaaaa", "#999999", "#DC2A22", "#f1f1f1"]
brights = ["#505050", "#5f8787", "#c1c1c1", "#888888", "#aaaaaa", "#B29740", "#DC2A22", "#f1f1f1"]

[colors.tab_bar]
inactive_tab_edge = "#505050"
background = "#191A11"

[colors.tab_bar.active_tab]
fg_color = "#5f8787"
bg_color = "#222222"

[colors.tab_bar.inactive_tab]
fg_color = "#505050"
bg_color = "#191A11"

[colors.tab_bar.inactive_tab_hover]
fg_color = "#505050"
bg_color = "#191A11"
# intensity = "Bold"

[colors.tab_bar.new_tab_hover]
fg_color = "#5f8787"
bg_color = "#222222"
intensity = "Bold"

[colors.tab_bar.new_tab]
fg_color = "#5f8787"
bg_color = "#191A11"

