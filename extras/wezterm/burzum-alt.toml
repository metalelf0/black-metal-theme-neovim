[colors]
foreground = "#f1f1f1"
background = "#231c14"
# background = "#231c14" # alternate, darker bg
cursor_bg = "#f1f1f1"
cursor_border = "#f1f1f1"
cursor_fg = "#231c14"
selection_bg = "#3B3B3B"
selection_fg = "#f1f1f1"
split = "#505050"
compose_cursor = "#aaaaaa"
scrollbar_thumb = "#505050"

ansi = ["#231c14", "#5f8787", "#c1c1c1", "#888888", "#aaaaaa", "#999999", "#ddeecc", "#f1f1f1"]
brights = ["#505050", "#5f8787", "#c1c1c1", "#888888", "#aaaaaa", "#99bbaa", "#ddeecc", "#f1f1f1"]

[colors.tab_bar]
