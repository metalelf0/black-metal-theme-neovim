background = "#231c14"

[colors.tab_bar.active_tab]
fg_color = "#5f8787"
bg_color = "#3B3B3B"

[colors.tab_bar.inactive_tab]
fg_color = "#505050"
bg_color = "#231c14"

[colors.tab_bar.inactive_tab_hover]
fg_color = "#505050"
bg_color = "#231c14"
# intensity = "Bold"

[colors.tab_bar.new_tab_hover]
fg_color = "#5f8787"
bg_color = "#3B3B3B"
intensity = "Bold"

[colors.tab_bar.new_tab]
fg_color = "#5f8787"
bg_color = "#231c14"

