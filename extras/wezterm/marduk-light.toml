[colors]
foreground = "#0e1a19"
background = "#dbe1e0"
# background = "#bbd3d1" # alternate, darker bg
cursor_bg = "#0e1a19"
cursor_border = "#0e1a19"
cursor_fg = "#dbe1e0"
selection_bg = "#bcd2ce"
selection_fg = "#0e1a19"
split = "#445a58"
compose_cursor = "#2f6129"
scrollbar_thumb = "#445a58"

ansi = ["#bbd3d1", "#a13b3b", "#0e1a19", "#296047", "#2c5e5d", "#265e3c", "#4b5950", "#0e1a19"]
