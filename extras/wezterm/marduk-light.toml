[colors.tab_bar.inactive_tab_hover]
fg_color = "#445a58"
bg_color = "#dbe1e0"
# intensity = "Bold"

[colors.tab_bar.new_tab_hover]
fg_color = "#63365b"
bg_color = "#bcd2ce"
intensity = "Bold"

[colors.tab_bar.new_tab]
fg_color = "#63365b"
bg_color = "#dbe1e0"

