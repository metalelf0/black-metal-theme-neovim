[colors]
foreground = "#f1f1f1"
background = "#2a2325"
# background = "#2a2325" # alternate, darker bg
cursor_bg = "#f1f1f1"
cursor_border = "#f1f1f1"
cursor_fg = "#2a2325"
selection_bg = "#434343"
selection_fg = "#f1f1f1"
split = "#505050"
compose_cursor = "#aaaaaa"
scrollbar_thumb = "#505050"

ansi = ["#2a2325", "#5f8787", "#c1c1c1", "#888888", "#aaaaaa", "#999999", "#ddeecc", "#f1f1f1"]
brights = ["#505050", "#5f8787", "#c1c1c1", "#888888", "#aaaaaa", "#9b8d7f", "#ddeecc", "#f1f1f1"]

[colors.tab_bar]
inactive_tab_edge = "#505050"
background = "#2a2325"

[colors.tab_bar.active_tab]
fg_color = "#5f8787"
bg_color = "#434343"

[colors.tab_bar.inactive_tab]
fg_color = "#505050"
bg_color = "#2a2325"

[colors.tab_bar.inactive_tab_hover]
fg_color = "#505050"
bg_color = "#2a2325"
# intensity = "Bold"

[colors.tab_bar.new_tab_hover]
fg_color = "#5f8787"
bg_color = "#434343"
intensity = "Bold"

[colors.tab_bar.new_tab]
fg_color = "#5f8787"
bg_color = "#2a2325"

