# name: NILE LIGHT ALT colors for Alacritty
# url: https://github.com/alacritty/alacritty
# upstream: https://github.com/metalelf0/black-metal.nvim/raw/main/extras/alacritty/nile-light-alt.toml
# author: Andrea Schiavini (original code by Casey Miller)

# Default colors
[colors.primary]
background = '#e5c4a4'
# alternate, darker background = '#e5c4a4'
foreground = '#17130d'

#[colors.cursor]
#cursor = '#17130d'
#text = '#e5c4a4'

# Normal colors
[colors.normal]
black = '#e5c4a4'
red = '#a13b3b'
green = '#17130d'
yellow = '#555525'
blue = '#445a2b'
magenta = '#6c4e2c'
cyan = '#634f3a'
white = '#17130d'

# Bright colors
[colors.bright]
black = '#5d5346'
red = '#a13b3b'
green = '#17130d'
yellow = '#555525'
blue = '#445a2b'
magenta = '#565633'
cyan = '#634f3a'
white = '#17130d'

# Indexed Colors
[[colors.indexed_colors]]
index = 16
color = '#813a37'

[[colors.indexed_colors]]
index = 17
color = '#364563'
