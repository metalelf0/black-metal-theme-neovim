# name: NILE ALT colors for Alacritty
# url: https://github.com/alacritty/alacritty
# upstream: https://github.com/metalelf0/black-metal.nvim/raw/main/extras/alacritty/nile-alt.toml
# author: Andrea Schiavini (original code by Casey Miller)

# Default colors
[colors.primary]
background = '#301807'
# alternate, darker background = '#301807'
foreground = '#f1f1f1'

#[colors.cursor]
#cursor = '#f1f1f1'
#text = '#301807'

# Normal colors
[colors.normal]
black = '#301807'
red = '#5f8787'
green = '#c1c1c1'
yellow = '#888888'
blue = '#aaaaaa'
magenta = '#999999'
cyan = '#aa9988'
white = '#f1f1f1'

# Bright colors
[colors.bright]
black = '#505050'
red = '#5f8787'
green = '#c1c1c1'
yellow = '#888888'
blue = '#aaaaaa'
magenta = '#777755'
cyan = '#aa9988'
white = '#f1f1f1'

# Indexed Colors
[[colors.indexed_colors]]
index = 16
color = '#aaaaaa'

[[colors.indexed_colors]]
index = 17
color = '#5f8787'
