# Default colors
[colors.primary]
background = '#c0cbed'
# alternate, darker background = '#c0cbed'
foreground = '#121621'

#[colors.cursor]
#cursor = '#121621'
#text = '#c0cbed'

# Normal colors
[colors.normal]
black = '#c0cbed'
red = '#a13b3b'
green = '#121621'
yellow = '#345779'
blue = '#3b3d7d'
magenta = '#6c4e2c'
cyan = '#7f4200'
white = '#121621'

# Bright colors
[colors.bright]
black = '#4f5669'
red = '#a13b3b'
green = '#121621'
yellow = '#345779'
blue = '#3b3d7d'
magenta = '#20578e'
cyan = '#7f4200'
white = '#121621'

# Indexed Colors
[[colors.indexed_colors]]
index = 16
color = '#813b37'

[[colors.indexed_colors]]
index = 17
color = '#633d36'
