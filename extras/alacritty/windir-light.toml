# Normal colors
[colors.normal]
black = '#bfdeb5'
red = '#a13b3b'
green = '#172112'
yellow = '#344d79'
blue = '#423b7d'
magenta = '#5e5e26'
cyan = '#5e5e12'
white = '#172112'

# Bright colors
[colors.bright]
black = '#506049'
red = '#a13b3b'
green = '#172112'
yellow = '#344d79'
blue = '#423b7d'
magenta = '#3e5b8e'
