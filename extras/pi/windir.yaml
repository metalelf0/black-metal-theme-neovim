# name: WINDIR colors for Pi
# url: https://github.com/pi
# upstream: https://github.com/metalelf0/black-metal.nvim/raw/main/extras/pi/windir.yaml
# author: Andrea Schiavini (original code by Casey Miller)

theme:
  background: "#000000"
  foreground: "#c1c1c1"
  alternate_background: "#181c15"
  alternate_foreground: "#5f8787"
  comment: "#505050"
  visual_selection: "#222222"
  line_highlight: "#000000"

colors:
  black: "#181c15"
  grey: "#505050"
  red: "#5f8787"
  orange: "#aaaaaa"
  green: "#c1c1c1"
  yellow: "#888888"
  blue: "#aaaaaa"
  purple: "#999999"
  magenta: "#5E77A3"
  cyan: "#D9D98E"
  white: "#c1c1c1"

palette:
  string: "#D9D98E"
  number: "#aaaaaa"
  keyword: "#999999"
  function: "#888888"
  type: "#5E77A3"
  constant: "#aaaaaa"
  operator: "#9b99a3"
  property: "#c1c1c1"
