# name: EMPEROR LIGHT ALT colors for Starship
# url: https://starship.rs
# upstream: https://github.com/metalelf0/black-metal.nvim/raw/main/extras/starship/emperor-light-alt.toml
# author: Andrea Schiavini (original code by Casey Miller)

palette = EMPEROR LIGHT ALT

[palettes.EMPEROR LIGHT ALT]
bg = "#cfc1e6"
fg = "#15101e"
alt = "#595131"
alt_bg = "#cfc1e6"
black = "#cfc1e6"
grey = "#584f69"
red = "#a13b3b"
orange = "#3e3781"
green = "#15101e"
yellow = "#3c3479"
blue = "#613b7d"
purple = "#5b327b"
magenta = "#4431d4"
cyan = "#5e486f"
white = "#15101e"
comment = "#584f69"
visual = "#AE9FC4"
line = "#cfc1e6"

# Format for cmd_duration
[cmd_duration]
format = "[$duration]($style) "
style = "bg:$visual fg:$fg"

# Directory
[directory]
style = "fg:$alt"

# Git branch
[git_branch]
symbol = "🌱 "
style = "fg:$orange"

# Git status
[git_status]
style = "fg:$green"

# Hostname
[hostname]
ssh_symbol = "🔒 "
style = "fg:$yellow"

# Kubernetes
[kubernetes]
symbol = "☸️  "
style = "fg:$blue"

# Python
[python]
symbol = "🐍 "
style = "fg:$green"

# Rust
[rust]
symbol = "🦀 "
style = "fg:$red"

# Time
[time]
format = "[$time]($style) "
style = "fg:$comment"

# Username
[username]
style_root = "fg:$red"
style_user = "fg:$cyan"
