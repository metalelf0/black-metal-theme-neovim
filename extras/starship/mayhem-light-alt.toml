# name: MAYHEM LIGHT ALT colors for Starship
# url: https://starship.rs
# upstream: https://github.com/metalelf0/black-metal.nvim/raw/main/extras/starship/mayhem-light-alt.toml
# author: Andrea Schiavini (original code by Casey Miller)

palette = MAYHEM LIGHT ALT

[palettes.MAYHEM LIGHT ALT]
bg = "#e4afaf"
fg = "#000000"
alt = "#324c5c"
alt_bg = "#e4afaf"
black = "#e4afaf"
grey = "#524b3e"
red = "#a13b3b"
orange = "#683e2c"
green = "#000000"
yellow = "#554925"
blue = "#444c24"
purple = "#534822"
magenta = "#5c4400"
cyan = "#5a480c"
white = "#000000"
comment = "#524b3e"
visual = "#BBB083"
line = "#e4afaf"

# Format for cmd_duration
[cmd_duration]
format = "[$duration]($style) "
style = "bg:$visual fg:$fg"

# Directory
[directory]
style = "fg:$alt"

# Git branch
[git_branch]
symbol = "🌱 "
style = "fg:$orange"

# Git status
[git_status]
style = "fg:$green"

# Hostname
[hostname]
ssh_symbol = "🔒 "
style = "fg:$yellow"

# Kubernetes
[kubernetes]
symbol = "☸️  "
style = "fg:$blue"

# Python
[python]
symbol = "🐍 "
style = "fg:$green"

# Rust
[rust]
symbol = "🦀 "
style = "fg:$red"

# Time
[time]
format = "[$time]($style) "
style = "fg:$comment"

# Username
[username]
style_root = "fg:$red"
style_user = "fg:$cyan"
