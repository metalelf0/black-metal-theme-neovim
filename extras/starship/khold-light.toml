# name: KHOLD LIGHT colors for Starship
# url: https://starship.rs
# upstream: https://github.com/metalelf0/black-metal.nvim/raw/main/extras/starship/khold-light.toml
# author: Andrea Schiavini (original code by Casey Miller)

palette = KHOLD LIGHT

[palettes.KHOLD LIGHT]
bg = "#f5e0e5"
fg = "#1e1013"
alt = "#31594e"
alt_bg = "#e9bec7"
black = "#e9bec7"
grey = "#664d52"
red = "#a13b3b"
orange = "#615029"
green = "#1e1013"
yellow = "#793834"
blue = "#684e31"
purple = "#4e5723"
magenta = "#8f342e"
cyan = "#4f5729"
white = "#1e1013"
comment = "#664d52"
visual = "#eebac6"
line = "#f5e0e5"

# Format for cmd_duration
[cmd_duration]
format = "[$duration]($style) "
style = "bg:$visual fg:$fg"

# Directory
[directory]
style = "fg:$alt"

# Git branch
[git_branch]
symbol = "🌱 "
style = "fg:$orange"

# Git status
[git_status]
style = "fg:$green"

# Hostname
[hostname]
ssh_symbol = "🔒 "
style = "fg:$yellow"

# Kubernetes
[kubernetes]
symbol = "☸️  "
style = "fg:$blue"

# Python
[python]
symbol = "🐍 "
style = "fg:$green"

# Rust
[rust]
symbol = "🦀 "
style = "fg:$red"

# Time
[time]
format = "[$time]($style) "
style = "fg:$comment"

# Username
[username]
style_root = "fg:$red"
style_user = "fg:$cyan"
