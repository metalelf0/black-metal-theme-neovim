# name: BATHORY LIGHT ALT colors for Starship
# url: https://starship.rs
# upstream: https://github.com/metalelf0/black-metal.nvim/raw/main/extras/starship/bathory-light-alt.toml
# author: Andrea Schiavini (original code by Casey Miller)

palette = BATHORY LIGHT ALT

[palettes.BATHORY LIGHT ALT]
bg = "#eac2b8"
fg = "#1e1510"
alt = "#32595c"
alt_bg = "#eac2b8"
black = "#eac2b8"
grey = "#63524b"
red = "#a13b3b"
orange = "#813b37"
green = "#1e1510"
yellow = "#6e4b2f"
blue = "#5a552b"
purple = "#6c4e2c"
magenta = "#8a3c00"
cyan = "#7f4200"
white = "#1e1510"
comment = "#63524b"
visual = "#f2ccb5"
line = "#eac2b8"

# Format for cmd_duration
[cmd_duration]
format = "[$duration]($style) "
style = "bg:$visual fg:$fg"

# Directory
[directory]
style = "fg:$alt"

# Git branch
[git_branch]
symbol = "🌱 "
style = "fg:$orange"

# Git status
[git_status]
style = "fg:$green"

# Hostname
[hostname]
ssh_symbol = "🔒 "
style = "fg:$yellow"

# Kubernetes
[kubernetes]
symbol = "☸️  "
style = "fg:$blue"

# Python
[python]
symbol = "🐍 "
style = "fg:$green"

# Rust
[rust]
symbol = "🦀 "
style = "fg:$red"

# Time
[time]
format = "[$time]($style) "
style = "fg:$comment"

# Username
[username]
style_root = "fg:$red"
style_user = "fg:$cyan"
