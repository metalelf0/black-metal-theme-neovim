# name: WINDIR LIGHT colors for Starship
# url: https://starship.rs
# upstream: https://github.com/metalelf0/black-metal.nvim/raw/main/extras/starship/windir-light.toml
# author: Andrea Schiavini (original code by Casey Miller)

palette = WINDIR LIGHT

[palettes.WINDIR LIGHT]
bg = "#ddecd5"
fg = "#172112"
alt = "#634436"
alt_bg = "#bfdeb5"
black = "#bfdeb5"
grey = "#506049"
red = "#a13b3b"
orange = "#735431"
green = "#172112"
yellow = "#344d79"
blue = "#423b7d"
purple = "#5e5e26"
magenta = "#3e5b8e"
cyan = "#5e5e12"
white = "#172112"
comment = "#506049"
visual = "#c3e3b0"
line = "#ddecd5"

# Format for cmd_duration
[cmd_duration]
format = "[$duration]($style) "
style = "bg:$visual fg:$fg"

# Directory
[directory]
style = "fg:$alt"

# Git branch
[git_branch]
symbol = "🌱 "
style = "fg:$orange"

# Git status
[git_status]
style = "fg:$green"

# Hostname
[hostname]
ssh_symbol = "🔒 "
style = "fg:$yellow"

# Kubernetes
[kubernetes]
symbol = "☸️  "
style = "fg:$blue"

# Python
[python]
symbol = "🐍 "
style = "fg:$green"

# Rust
[rust]
symbol = "🦀 "
style = "fg:$red"

# Time
[time]
format = "[$time]($style) "
style = "fg:$comment"

# Username
[username]
style_root = "fg:$red"
style_user = "fg:$cyan"
