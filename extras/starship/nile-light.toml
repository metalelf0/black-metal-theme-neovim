# name: NILE LIGHT colors for Starship
# url: https://starship.rs
# upstream: https://github.com/metalelf0/black-metal.nvim/raw/main/extras/starship/nile-light.toml
# author: Andrea Schiavini (original code by Casey Miller)

palette = NILE LIGHT

[palettes.NILE LIGHT]
bg = "#ede0c9"
fg = "#17130d"
alt = "#364563"
alt_bg = "#e5c4a4"
black = "#e5c4a4"
grey = "#5d5346"
red = "#a13b3b"
orange = "#813a37"
green = "#17130d"
yellow = "#555525"
blue = "#445a2b"
purple = "#6c4e2c"
magenta = "#565633"
cyan = "#634f3a"
white = "#17130d"
comment = "#5d5346"
visual = "#e8cea1"
line = "#ede0c9"

# Format for cmd_duration
[cmd_duration]
format = "[$duration]($style) "
style = "bg:$visual fg:$fg"

# Directory
[directory]
style = "fg:$alt"

# Git branch
[git_branch]
symbol = "🌱 "
style = "fg:$orange"

# Git status
[git_status]
style = "fg:$green"

# Hostname
[hostname]
ssh_symbol = "🔒 "
style = "fg:$yellow"

# Kubernetes
[kubernetes]
symbol = "☸️  "
style = "fg:$blue"

# Python
[python]
symbol = "🐍 "
style = "fg:$green"

# Rust
[rust]
symbol = "🦀 "
style = "fg:$red"

# Time
[time]
format = "[$time]($style) "
style = "fg:$comment"

# Username
[username]
style_root = "fg:$red"
style_user = "fg:$cyan"
