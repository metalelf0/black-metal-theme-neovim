# name: GORGOROTH LIGHT ALT colors for Starship
# url: https://starship.rs
# upstream: https://github.com/metalelf0/black-metal.nvim/raw/main/extras/starship/gorgoroth-light-alt.toml
# author: Andrea Schiavini (original code by Casey Miller)

palette = GORGOROTH LIGHT ALT

[palettes.GORGOROTH LIGHT ALT]
bg = "#cfbfc7"
fg = "#11090d"
alt = "#315459"
alt_bg = "#cfbfc7"
black = "#cfbfc7"
grey = "#604954"
red = "#a13b3b"
orange = "#4d4f22"
green = "#11090d"
yellow = "#67492c"
blue = "#535127"
purple = "#3d5723"
magenta = "#5c4c3d"
cyan = "#335511"
white = "#11090d"
comment = "#604954"
visual = "#B7A4AA"
line = "#cfbfc7"

# Format for cmd_duration
[cmd_duration]
format = "[$duration]($style) "
style = "bg:$visual fg:$fg"

# Directory
[directory]
style = "fg:$alt"

# Git branch
[git_branch]
symbol = "🌱 "
style = "fg:$orange"

# Git status
[git_status]
style = "fg:$green"

# Hostname
[hostname]
ssh_symbol = "🔒 "
style = "fg:$yellow"

# Kubernetes
[kubernetes]
symbol = "☸️  "
style = "fg:$blue"

# Python
[python]
symbol = "🐍 "
style = "fg:$green"

# Rust
[rust]
symbol = "🦀 "
style = "fg:$red"

# Time
[time]
format = "[$time]($style) "
style = "fg:$comment"

# Username
[username]
style_root = "fg:$red"
style_user = "fg:$cyan"
