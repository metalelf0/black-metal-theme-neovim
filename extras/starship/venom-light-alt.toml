# name: VENOM LIGHT ALT colors for Starship
# url: https://starship.rs
# upstream: https://github.com/metalelf0/black-metal.nvim/raw/main/extras/starship/venom-light-alt.toml
# author: Andrea Schiavini (original code by Casey Miller)

palette = VENOM LIGHT ALT

[palettes.VENOM LIGHT ALT]
bg = "#ddcacc"
fg = "#211212"
alt = "#325c4f"
alt_bg = "#ddcacc"
black = "#ddcacc"
grey = "#6c5151"
red = "#a13b3b"
orange = "#764b32"
green = "#211212"
yellow = "#793534"
blue = "#6f5034"
purple = "#5e5526"
magenta = "#ae0200"
cyan = "#5e5527"
white = "#211212"
comment = "#6c5151"
visual = "#e0d6d6"
line = "#ddcacc"

# Format for cmd_duration
[cmd_duration]
format = "[$duration]($style) "
style = "bg:$visual fg:$fg"

# Directory
[directory]
style = "fg:$alt"

# Git branch
[git_branch]
symbol = "🌱 "
style = "fg:$orange"

# Git status
[git_status]
style = "fg:$green"

# Hostname
[hostname]
ssh_symbol = "🔒 "
style = "fg:$yellow"

# Kubernetes
[kubernetes]
symbol = "☸️  "
style = "fg:$blue"

# Python
[python]
symbol = "🐍 "
style = "fg:$green"

# Rust
[rust]
symbol = "🦀 "
style = "fg:$red"

# Time
[time]
format = "[$time]($style) "
style = "fg:$comment"

# Username
[username]
style_root = "fg:$red"
style_user = "fg:$cyan"
