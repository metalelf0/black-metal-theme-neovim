# name: TAAKE LIGHT ALT colors for Starship
# url: https://starship.rs
# upstream: https://github.com/metalelf0/black-metal.nvim/raw/main/extras/starship/taake-light-alt.toml
# author: Andrea Schiavini (original code by Casey Miller)

palette = TAAKE LIGHT ALT

[palettes.TAAKE LIGHT ALT]
bg = "#cdb7c6"
fg = "#030203"
alt = "#2d4f52"
alt_bg = "#cdb7c6"
black = "#cdb7c6"
grey = "#5d4658"
red = "#a13b3b"
orange = "#6f3c2f"
green = "#030203"
yellow = "#64432b"
blue = "#504b26"
purple = "#5a4925"
magenta = "#57483d"
cyan = "#514733"
white = "#030203"
comment = "#5d4658"
visual = "#d4b5cd"
line = "#cdb7c6"

# Format for cmd_duration
[cmd_duration]
format = "[$duration]($style) "
style = "bg:$visual fg:$fg"

# Directory
[directory]
style = "fg:$alt"

# Git branch
[git_branch]
symbol = "🌱 "
style = "fg:$orange"

# Git status
[git_status]
style = "fg:$green"

# Hostname
[hostname]
ssh_symbol = "🔒 "
style = "fg:$yellow"

# Kubernetes
[kubernetes]
symbol = "☸️  "
style = "fg:$blue"

# Python
[python]
symbol = "🐍 "
style = "fg:$green"

# Rust
[rust]
symbol = "🦀 "
style = "fg:$red"

# Time
[time]
format = "[$time]($style) "
style = "fg:$comment"

# Username
[username]
style_root = "fg:$red"
style_user = "fg:$cyan"
