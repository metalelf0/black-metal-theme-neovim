# name: IMPALED-NAZARENE LIGHT colors for Starship
# url: https://starship.rs
# upstream: https://github.com/metalelf0/black-metal.nvim/raw/main/extras/starship/impaled-nazarene-light.toml
# author: Andrea Schiavini (original code by Casey Miller)

palette = IMPALED-NAZARENE LIGHT

[palettes.IMPALED-NAZARENE LIGHT]
bg = "#edf1d5"
fg = "#1f2112"
alt = "#365063"
alt_bg = "#dbe7ac"
black = "#dbe7ac"
grey = "#61664d"
red = "#a13b3b"
orange = "#813756"
green = "#1f2112"
yellow = "#6e602f"
blue = "#5c6831"
purple = "#7b3632"
magenta = "#755f1a"
cyan = "#c30c03"
white = "#1f2112"
comment = "#61664d"
visual = "#e2ebad"
line = "#edf1d5"

# Format for cmd_duration
[cmd_duration]
format = "[$duration]($style) "
style = "bg:$visual fg:$fg"

# Directory
[directory]
style = "fg:$alt"

# Git branch
[git_branch]
symbol = "🌱 "
style = "fg:$orange"

# Git status
[git_status]
style = "fg:$green"

# Hostname
[hostname]
ssh_symbol = "🔒 "
style = "fg:$yellow"

# Kubernetes
[kubernetes]
symbol = "☸️  "
style = "fg:$blue"

# Python
[python]
symbol = "🐍 "
style = "fg:$green"

# Rust
[rust]
symbol = "🦀 "
style = "fg:$red"

# Time
[time]
format = "[$time]($style) "
style = "fg:$comment"

# Username
[username]
style_root = "fg:$red"
style_user = "fg:$cyan"
