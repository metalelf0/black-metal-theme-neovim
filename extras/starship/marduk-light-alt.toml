# name: MARDUK LIGHT ALT colors for Starship
# url: https://starship.rs
# upstream: https://github.com/metalelf0/black-metal.nvim/raw/main/extras/starship/marduk-light-alt.toml
# author: Andrea Schiavini (original code by Casey Miller)

palette = MARDUK LIGHT ALT

[palettes.MARDUK LIGHT ALT]
bg = "#bbd3d1"
fg = "#0e1a19"
alt = "#63365b"
alt_bg = "#bbd3d1"
black = "#bbd3d1"
grey = "#445a58"
red = "#a13b3b"
orange = "#2f6129"
green = "#0e1a19"
yellow = "#296047"
blue = "#2c5e5d"
purple = "#265e3c"
magenta = "#495b52"
cyan = "#4b5950"
white = "#0e1a19"
comment = "#445a58"
visual = "#bcd2ce"
line = "#bbd3d1"

# Format for cmd_duration
[cmd_duration]
format = "[$duration]($style) "
style = "bg:$visual fg:$fg"

# Directory
[directory]
style = "fg:$alt"

# Git branch
[git_branch]
symbol = "🌱 "
style = "fg:$orange"

# Git status
[git_status]
style = "fg:$green"

# Hostname
[hostname]
ssh_symbol = "🔒 "
style = "fg:$yellow"

# Kubernetes
[kubernetes]
symbol = "☸️  "
style = "fg:$blue"

# Python
[python]
symbol = "🐍 "
style = "fg:$green"

# Rust
[rust]
symbol = "🦀 "
style = "fg:$red"

# Time
[time]
format = "[$time]($style) "
style = "fg:$comment"

# Username
[username]
style_root = "fg:$red"
style_user = "fg:$cyan"
