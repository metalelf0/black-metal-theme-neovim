# name: DARKTHRONE LIGHT colors for Starship
# url: https://starship.rs
# upstream: https://github.com/metalelf0/black-metal.nvim/raw/main/extras/starship/darkthrone-light.toml
# author: Andrea Schiavini (original code by Casey Miller)

palette = DARKTHRONE LIGHT

[palettes.DARKTHRONE LIGHT]
bg = "#f2f2f0"
fg = "#1a1a1a"
alt = "#444444"
alt_bg = "#f2f2f0"
black = "#f2f2f0"
grey = "#6a6a6a"
red = "#a13b3b"
orange = "#5e5e5e"
green = "#1a1a1a"
yellow = "#555555"
blue = "#5e5e5e"
purple = "#4a4a4a"
magenta = "#000000"
cyan = "#000000"
white = "#1a1a1a"
comment = "#6a6a6a"
visual = "#d9d9d6"
line = "#f2f2f0"

# Format for cmd_duration
[cmd_duration]
format = "[$duration]($style) "
style = "bg:$visual fg:$fg"

# Directory
[directory]
style = "fg:$alt"

# Git branch
[git_branch]
symbol = "🌱 "
style = "fg:$orange"

# Git status
[git_status]
style = "fg:$green"

# Hostname
[hostname]
ssh_symbol = "🔒 "
style = "fg:$yellow"

# Kubernetes
[kubernetes]
symbol = "☸️  "
style = "fg:$blue"

# Python
[python]
symbol = "🐍 "
style = "fg:$green"

# Rust
[rust]
symbol = "🦀 "
style = "fg:$red"

# Time
[time]
format = "[$time]($style) "
style = "fg:$comment"

# Username
[username]
style_root = "fg:$red"
style_user = "fg:$cyan"
