# name: THYRFING LIGHT ALT colors for Helix
# url: https://helix-editor.com/
# upstream: https://github.com/metalelf0/black-metal.nvim/raw/main/extras/helix/thyrfing-light-alt.toml
# author: Andrea Schiavini (original code by Casey Miller)

# Interface
"ui.background" = { bg = "#eabbb8" }
"ui.text" = "#170e0d"
"ui.text.focus" = { fg = "#2f5651", modifiers = ["bold"] }
"ui.text.inactive" = "#634e4b"
"ui.text.info" = "#99270a"
"ui.text.directory" = "#912f18"
"ui.cursor" = { fg = "#eabbb8", bg = "#170e0d" }
"ui.cursor.primary" = { fg = "#eabbb8", bg = "#2f5651" }
"ui.cursor.match" = { fg = "#2f5651", modifiers = ["bold"] }
"ui.gutter" = { fg = "#634e4b", bg = "#eabbb8" }
"ui.gutter.selected" = { fg = "#170e0d", bg = "#eabbb8" }
"ui.linenr" = "#634e4b"
"ui.linenr.selected" = { fg = "#2f5651", modifiers = ["bold"] }
"ui.statusline" = { fg = "#170e0d", bg = "#eabbb8" }
"ui.statusline.inactive" = { fg = "#634e4b", bg = "#eabbb8" }
"ui.statusline.normal" = { fg = "#eabbb8", bg = "#2f5651" }
"ui.statusline.insert" = { fg = "#eabbb8", bg = "#4b6b3f" }
"ui.statusline.select" = { fg = "#eabbb8", bg = "#3a6ea5" }
"ui.statusline.separator" = "#634e4b"
"ui.bufferline" = { fg = "#634e4b", bg = "#eabbb8" }
"ui.bufferline.active" = { fg = "#170e0d", bg = "#eabbb8", modifiers = ["bold"] }
"ui.bufferline.background" = { bg = "#eabbb8" }
"ui.popup" = { fg = "#170e0d", bg = "#eabbb8" }
"ui.popup.info" = { fg = "#99270a", bg = "#eabbb8" }
"ui.window" = { fg = "#634e4b" }
"ui.help" = { fg = "#170e0d", bg = "#eabbb8" }
"ui.virtual.ruler" = { bg = "#eabbb8" }
"ui.virtual.whitespace" = "#634e4b"
"ui.virtual.indent-guide" = "#634e4b"
"ui.virtual.inlay-hint" = { fg = "#634e4b", modifiers = ["italic"] }
"ui.virtual.wrap" = "#634e4b"
"ui.virtual.jump-label" = { fg = "#2f5651", modifiers = ["bold"] }
"ui.menu" = { fg = "#170e0d", bg = "#eabbb8" }
"ui.menu.selected" = { fg = "#eabbb8", bg = "#2f5651", modifiers = ["bold"] }
"ui.menu.scroll" = { fg = "#2f5651", bg = "#eabbb8" }
"ui.selection" = { fg = "#170e0d", bg = "#efb9b3" }
"ui.selection.primary" = { fg = "#170e0d", bg = "#eabbb8" }
"ui.highlight" = { bg = "#eabbb8" }
"ui.cursorline.primary" = { bg = "#eabbb8" }
"ui.cursorcolumn.primary" = { bg = "#eabbb8" }

# Syntax
"attribute" = "#2f5651"
"type" = "#912f18"
"type.builtin" = "#614f2e"
"type.parameter" = "#170e0d"
"type.enum.variant" = "#2f5651"
"constructor" = "#794134"
"constant" = "#614f2e"
"constant.builtin" = "#81374a"
"constant.character" = "#99270a"
"constant.character.escape" = "#7b4132"
"constant.numeric" = "#81374a"
"string" = "#99270a"
"string.regexp" = "#2f5651"
"string.special" = "#2f5651"
"string.special.path" = "#99270a"
"string.special.url" = { fg = "#99270a", modifiers = ["underlined"] }
"comment" = { fg = "#634e4b", modifiers = ["italic"] }
"comment.documentation" = { fg = "#634e4b", modifiers = ["italic"] }
"comment.unused" = { fg = "#634e4b", modifiers = ["crossed_out"] }
"variable" = "#170e0d"
"variable.builtin" = "#2f5651"
"variable.parameter" = "#170e0d"
"variable.other.member" = "#170e0d"
"label" = "#2f5651"
"punctuation" = "#634945"
"keyword" = "#7b4132"
"keyword.control" = "#7b4132"
"keyword.directive" = "#2f5651"
"keyword.function" = "#794134"
"keyword.storage" = "#2f5651"
"operator" = "#634945"
"function" = "#794134"
"function.builtin" = "#2f5651"
"function.method" = "#794134"
"function.macro" = "#7b4132"
"tag" = "#2f5651"
"namespace" = "#912f18"
"special" = "#2f5651"
"markup.heading" = { fg = "#794134", modifiers = ["bold"] }
"markup.heading.marker" = "#634e4b"
"markup.list" = "#634945"
"markup.bold" = { modifiers = ["bold"] }
"markup.italic" = { modifiers = ["italic"] }
"markup.strikethrough" = { modifiers = ["crossed_out"] }
"markup.link.url" = { fg = "#99270a", modifiers = ["underlined"] }
"markup.link.label" = "#2f5651"
"markup.link.text" = "#170e0d"
"markup.quote" = "#634e4b"
"markup.raw" = "#99270a"

# Diagnostics and diff
"warning" = "#8a6d1f"
"error" = "#a13b3b"
"info" = "#3a6ea5"
"hint" = "#4b6b3f"
"diagnostic" = { underline = { color = "#634e4b", style = "curl" } }
"diagnostic.hint" = { underline = { color = "#4b6b3f", style = "curl" } }
"diagnostic.info" = { underline = { color = "#3a6ea5", style = "curl" } }
"diagnostic.warning" = { underline = { color = "#8a6d1f", style = "curl" } }
"diagnostic.error" = { underline = { color = "#a13b3b", style = "curl" } }
"diagnostic.unnecessary" = { modifiers = ["dim"] }
"diagnostic.deprecated" = { modifiers = ["crossed_out"] }
"diff.plus" = "#4b6b3f"
"diff.plus.gutter" = "#4b6b3f"
"diff.minus" = "#a13b3b"
"diff.minus.gutter" = "#a13b3b"
"diff.delta" = "#8a6d1f"
"diff.delta.gutter" = "#8a6d1f"
"diff.moved" = "#3a6ea5"
"diff.conflict" = "#81374a"

# Theme palette
[palette]
black = "#eabbb8"
grey = "#634e4b"
red = "#a13b3b"
orange = "#81374a"
green = "#170e0d"
yellow = "#794134"
blue = "#614f2e"
purple = "#7b4132"
magenta = "#912f18"
cyan = "#99270a"
white = "#170e0d"
foreground = "#170e0d"
background = "#eabbb8"
selection = "#efb9b3"
