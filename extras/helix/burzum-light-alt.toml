orange = "#5b5d28"
green = "#12211a"
yellow = "#2c6749"
blue = "#306562"
purple = "#476529"
magenta = "#35644c"
cyan = "#3d6714"
white = "#12211a"
foreground = "#12211a"
background = "#e8d5ba"
selection = "#AACCBB"
