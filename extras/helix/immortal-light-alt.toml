# name: IMMORTAL LIGHT ALT colors for Helix
# url: https://helix-editor.com/
# upstream: https://github.com/metalelf0/black-metal.nvim/raw/main/extras/helix/immortal-light-alt.toml
# author: Andrea Schiavini (original code by Casey Miller)

# Interface
"ui.background" = { bg = "#c3d6df" }
"ui.text" = "#121b21"
"ui.text.focus" = { fg = "#633d36", modifiers = ["bold"] }
"ui.text.inactive" = "#4d5b66"
"ui.text.info" = "#315c87"
"ui.text.directory" = "#445c73"
"ui.cursor" = { fg = "#c3d6df", bg = "#121b21" }
"ui.cursor.primary" = { fg = "#c3d6df", bg = "#633d36" }
"ui.cursor.match" = { fg = "#633d36", modifiers = ["bold"] }
"ui.gutter" = { fg = "#4d5b66", bg = "#c3d6df" }
"ui.gutter.selected" = { fg = "#121b21", bg = "#c3d6df" }
"ui.linenr" = "#4d5b66"
"ui.linenr.selected" = { fg = "#633d36", modifiers = ["bold"] }
"ui.statusline" = { fg = "#121b21", bg = "#c3d6df" }
"ui.statusline.inactive" = { fg = "#4d5b66", bg = "#c3d6df" }
"ui.statusline.normal" = { fg = "#c3d6df", bg = "#633d36" }
