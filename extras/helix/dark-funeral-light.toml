"ui.selection.primary" = { fg = "#121621", bg = "#c0cbed" }
"ui.highlight" = { bg = "#e3e9f7" }
"ui.cursorline.primary" = { bg = "#e3e9f7" }
"ui.cursorcolumn.primary" = { bg = "#e3e9f7" }

# Syntax
"attribute" = "#633d36"
"type" = "#20578e"
"type.builtin" = "#3b3d7d"
"type.parameter" = "#121621"
"type.enum.variant" = "#633d36"
"constructor" = "#345779"
"constant" = "#3b3d7d"
"constant.builtin" = "#813b37"
"constant.character" = "#7f4200"
"constant.character.escape" = "#6c4e2c"
"constant.numeric" = "#813b37"
"string" = "#7f4200"
"string.regexp" = "#633d36"
"string.special" = "#633d36"
"string.special.path" = "#7f4200"
"string.special.url" = { fg = "#7f4200", modifiers = ["underlined"] }
"comment" = { fg = "#4f5669", modifiers = ["italic"] }
"comment.documentation" = { fg = "#4f5669", modifiers = ["italic"] }
"comment.unused" = { fg = "#4f5669", modifiers = ["crossed_out"] }
"variable" = "#121621"
"variable.builtin" = "#633d36"
"variable.parameter" = "#121621"
"variable.other.member" = "#121621"
"label" = "#633d36"
"punctuation" = "#4a5369"
"keyword" = "#6c4e2c"
"keyword.control" = "#6c4e2c"
"keyword.directive" = "#633d36"
"keyword.function" = "#345779"
"keyword.storage" = "#633d36"
"operator" = "#4a5369"
"function" = "#345779"
"function.builtin" = "#633d36"
"function.method" = "#345779"
"function.macro" = "#6c4e2c"
"tag" = "#633d36"
"namespace" = "#20578e"
"special" = "#633d36"
"markup.heading" = { fg = "#345779", modifiers = ["bold"] }
"markup.heading.marker" = "#4f5669"
"markup.list" = "#4a5369"
