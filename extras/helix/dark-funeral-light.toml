"ui.bufferline.active" = { fg = "#121621", bg = "#e3e9f7", modifiers = ["bold"] }
"ui.bufferline.background" = { bg = "#e3e9f7" }
"ui.popup" = { fg = "#121621", bg = "#e3e9f7" }
"ui.popup.info" = { fg = "#7f4200", bg = "#e3e9f7" }
"ui.window" = { fg = "#4f5669" }
"ui.help" = { fg = "#121621", bg = "#e3e9f7" }
"ui.virtual.ruler" = { bg = "#e3e9f7" }
"ui.virtual.whitespace" = "#4f5669"
"ui.virtual.indent-guide" = "#4f5669"
