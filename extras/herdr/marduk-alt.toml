# name: MARDUK ALT colors for Herdr
# url: https://github.com/herd
# upstream: https://github.com/metalelf0/black-metal.nvim/raw/main/extras/herdr/marduk-alt.toml
# author: Andrea Schiavini (original code by Casey Miller)

[theme]
background = "#060b12"
foreground = "#f1f1f1"
alternate_background = "#060b12"
alternate_foreground = "#5f8787"
comment = "#505050"
visual_selection = "#222222"
line_highlight = "#060b12"

[colors]
black = "#060b12"
grey = "#505050"
red = "#5f8787"
orange = "#aaaaaa"
green = "#c1c1c1"
yellow = "#888888"
blue = "#aaaaaa"
purple = "#999999"
magenta = "#626b67"
cyan = "#a5aaa7"
white = "#f1f1f1"

[palette]
string = "#a5aaa7"
number = "#aaaaaa"
keyword = "#999999"
function = "#888888"
type = "#626b67"
constant = "#aaaaaa"
operator = "#9b99a3"
property = "#c1c1c1"
