# name: KHOLD colors for Herdr
# url: https://github.com/herd
# upstream: https://github.com/metalelf0/black-metal.nvim/raw/main/extras/herdr/khold.toml
# author: Andrea Schiavini (original code by Casey Miller)

[theme]
background = "#000000"
foreground = "#f1f1f1"
alternate_background = "#39121b"
alternate_foreground = "#5f8787"
comment = "#505050"
visual_selection = "#222222"
line_highlight = "#000000"

[colors]
black = "#39121b"
grey = "#505050"
red = "#5f8787"
orange = "#aaaaaa"
green = "#f1f1f1"
yellow = "#888888"
blue = "#aaaaaa"
purple = "#999999"
magenta = "#974b46"
cyan = "#eceee3"
white = "#f1f1f1"

[palette]
string = "#eceee3"
number = "#aaaaaa"
keyword = "#999999"
function = "#888888"
type = "#974b46"
constant = "#aaaaaa"
operator = "#9b99a3"
property = "#f1f1f1"
