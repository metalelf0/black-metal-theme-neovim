# name: BURZUM ALT colors for Herdr
# url: https://github.com/herd
# upstream: https://github.com/metalelf0/black-metal.nvim/raw/main/extras/herdr/burzum-alt.toml
# author: Andrea Schiavini (original code by Casey Miller)

[theme]
background = "#231c14"
foreground = "#f1f1f1"
alternate_background = "#231c14"
alternate_foreground = "#5f8787"
comment = "#505050"
visual_selection = "#222222"
line_highlight = "#231c14"

[colors]
black = "#231c14"
grey = "#505050"
red = "#5f8787"
orange = "#aaaaaa"
green = "#c1c1c1"
yellow = "#888888"
blue = "#aaaaaa"
purple = "#999999"
magenta = "#99bbaa"
cyan = "#ddeecc"
white = "#f1f1f1"

[palette]
string = "#ddeecc"
number = "#aaaaaa"
keyword = "#999999"
function = "#888888"
type = "#99bbaa"
constant = "#aaaaaa"
operator = "#9b99a3"
property = "#c1c1c1"
