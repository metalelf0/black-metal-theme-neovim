# name: KHOLD ALT colors for Herdr
# url: https://github.com/herd
# upstream: https://github.com/metalelf0/black-metal.nvim/raw/main/extras/herdr/khold-alt.toml
# author: Andrea Schiavini (original code by Casey Miller)

[theme]
background = "#39121b"
foreground = "#f1f1f1"
alternate_background = "#39121b"
alternate_foreground = "#5f8787"
comment = "#505050"
visual_selection = "#3F3F3F"
line_highlight = "#39121b"

[colors]
black = "#39121b"
grey = "#505050"
red = "#5f8787"
orange = "#aaaaaa"
green = "#c1c1c1"
yellow = "#888888"
blue = "#aaaaaa"
purple = "#999999"
magenta = "#974b46"
cyan = "#eceee3"
white = "#f1f1f1"

[palette]
string = "#eceee3"
number = "#aaaaaa"
keyword = "#999999"
function = "#888888"
type = "#974b46"
constant = "#aaaaaa"
operator = "#9b99a3"
property = "#c1c1c1"
