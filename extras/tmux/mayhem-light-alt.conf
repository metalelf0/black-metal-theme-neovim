# name: MAYHEM LIGHT ALT colors for Tmux
# url: https://github.com/tmux/tmux
# upstream: https://github.com/metalelf0/black-metal.nvim/raw/main/extras/tmux/mayhem-light-alt.conf
# author: Andrea Schiavini (original code by Casey Miller)

# Color palette
set -g @black   "#e4afaf"
set -g @grey    "#524b3e"
set -g @red     "#a13b3b"
set -g @orange  "#683e2c"
set -g @green   "#000000"
set -g @yellow  "#554925"
set -g @blue    "#444c24"
set -g @purple  "#534822"
set -g @magenta "#5c4400"
set -g @cyan    "#5a480c"
set -g @white   "#000000"

# Theme colors
set -g @theme_bg          "#e4afaf"
set -g @theme_fg          "#000000"
set -g @theme_alt_bg      "#e4afaf"
set -g @theme_alt          "#324c5c"
set -g @theme_comment      "#524b3e"
set -g @theme_visual       "#BBB083"
set -g @theme_line         "#e4afaf"

# Status line
set -g status-style "bg=#BBB083,fg=#000000"
set -g status-left-style "bg=#BBB083,fg=#324c5c"
set -g status-right-style "bg=#BBB083,fg=#524b3e"

# Window status
set -g window-status-style "bg=#e4afaf,fg=#524b3e"
set -g window-status-current-style "bg=#BBB083,fg=#324c5c"
set -g window-status-activity-style "bg=#BBB083,fg=#683e2c"
set -g window-status-bell-style "bg=#BBB083,fg=#a13b3b"

# Panes
set -g pane-border-style "fg=#524b3e"
set -g pane-active-border-style "fg=#324c5c"

# Message
set -g message-style "bg=#BBB083,fg=#000000"

# Mode
set -g mode-style "bg=#683e2c,fg=#e4afaf"

# Clock
set -g clock-mode-colour "#324c5c"

# Copy mode
set -g copy-mode-match-style "bg=#683e2c,fg=#e4afaf"
set -g copy-mode-current-match-style "bg=#a13b3b,fg=#e4afaf"
