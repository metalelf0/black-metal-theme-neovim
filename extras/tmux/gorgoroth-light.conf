# name: GORGOROTH LIGHT colors for Tmux
# url: https://github.com/tmux/tmux
# upstream: https://github.com/metalelf0/black-metal.nvim/raw/main/extras/tmux/gorgoroth-light.conf
# author: Andrea Schiavini (original code by Casey Miller)

# Color palette
set -g @black   "#cfbfc7"
set -g @grey    "#604954"
set -g @red     "#a13b3b"
set -g @orange  "#4d4f22"
set -g @green   "#11090d"
set -g @yellow  "#67492c"
set -g @blue    "#535127"
set -g @purple  "#3d5723"
set -g @magenta "#5c4c3d"
set -g @cyan    "#335511"
set -g @white   "#11090d"

# Theme colors
set -g @theme_bg          "#e6e0e2"
set -g @theme_fg          "#11090d"
set -g @theme_alt_bg      "#cfbfc7"
set -g @theme_alt          "#315459"
set -g @theme_comment      "#604954"
set -g @theme_visual       "#d7c1c8"
set -g @theme_line         "#e6e0e2"

# Status line
set -g status-style "bg=#d7c1c8,fg=#11090d"
set -g status-left-style "bg=#d7c1c8,fg=#315459"
set -g status-right-style "bg=#d7c1c8,fg=#604954"

# Window status
set -g window-status-style "bg=#e6e0e2,fg=#604954"
set -g window-status-current-style "bg=#d7c1c8,fg=#315459"
set -g window-status-activity-style "bg=#d7c1c8,fg=#4d4f22"
set -g window-status-bell-style "bg=#d7c1c8,fg=#a13b3b"

# Panes
set -g pane-border-style "fg=#604954"
set -g pane-active-border-style "fg=#315459"

# Message
set -g message-style "bg=#d7c1c8,fg=#11090d"

# Mode
set -g mode-style "bg=#4d4f22,fg=#e6e0e2"

# Clock
set -g clock-mode-colour "#315459"

# Copy mode
set -g copy-mode-match-style "bg=#4d4f22,fg=#e6e0e2"
set -g copy-mode-current-match-style "bg=#a13b3b,fg=#e6e0e2"
