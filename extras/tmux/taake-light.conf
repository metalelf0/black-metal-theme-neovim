# name: TAAKE LIGHT colors for Tmux
# url: https://github.com/tmux/tmux
# upstream: https://github.com/metalelf0/black-metal.nvim/raw/main/extras/tmux/taake-light.conf
# author: Andrea Schiavini (original code by Casey Miller)

# Color palette
set -g @black   "#cdb7c6"
set -g @grey    "#5d4658"
set -g @red     "#a13b3b"
set -g @orange  "#6f3c2f"
set -g @green   "#030203"
set -g @yellow  "#64432b"
set -g @blue    "#504b26"
set -g @purple  "#5a4925"
set -g @magenta "#57483d"
set -g @cyan    "#514733"
set -g @white   "#030203"

# Theme colors
set -g @theme_bg          "#e1d6df"
set -g @theme_fg          "#030203"
set -g @theme_alt_bg      "#cdb7c6"
set -g @theme_alt          "#2d4f52"
set -g @theme_comment      "#5d4658"
set -g @theme_visual       "#d4b5cd"
set -g @theme_line         "#e1d6df"

# Status line
set -g status-style "bg=#d4b5cd,fg=#030203"
set -g status-left-style "bg=#d4b5cd,fg=#2d4f52"
set -g status-right-style "bg=#d4b5cd,fg=#5d4658"

# Window status
set -g window-status-style "bg=#e1d6df,fg=#5d4658"
set -g window-status-current-style "bg=#d4b5cd,fg=#2d4f52"
set -g window-status-activity-style "bg=#d4b5cd,fg=#6f3c2f"
set -g window-status-bell-style "bg=#d4b5cd,fg=#a13b3b"

# Panes
set -g pane-border-style "fg=#5d4658"
set -g pane-active-border-style "fg=#2d4f52"

# Message
set -g message-style "bg=#d4b5cd,fg=#030203"

# Mode
set -g mode-style "bg=#6f3c2f,fg=#e1d6df"

# Clock
set -g clock-mode-colour "#2d4f52"

# Copy mode
set -g copy-mode-match-style "bg=#6f3c2f,fg=#e1d6df"
set -g copy-mode-current-match-style "bg=#a13b3b,fg=#e1d6df"
