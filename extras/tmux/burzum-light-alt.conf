# name: BURZUM LIGHT ALT colors for Tmux
# url: https://github.com/tmux/tmux
# upstream: https://github.com/metalelf0/black-metal.nvim/raw/main/extras/tmux/burzum-light-alt.conf
# author: Andrea Schiavini (original code by Casey Miller)

# Color palette
set -g @black   "#e8d5ba"
set -g @grey    "#4b6357"
set -g @red     "#a13b3b"
set -g @orange  "#5b5d28"
set -g @green   "#12211a"
set -g @yellow  "#2c6749"
set -g @blue    "#306562"
set -g @purple  "#476529"
set -g @magenta "#35644c"
set -g @cyan    "#3d6714"
set -g @white   "#12211a"

# Theme colors
set -g @theme_bg          "#e8d5ba"
set -g @theme_fg          "#12211a"
set -g @theme_alt_bg      "#e8d5ba"
set -g @theme_alt          "#63365c"
set -g @theme_comment      "#4b6357"
set -g @theme_visual       "#AACCBB"
set -g @theme_line         "#e8d5ba"

# Status line
set -g status-style "bg=#AACCBB,fg=#12211a"
set -g status-left-style "bg=#AACCBB,fg=#63365c"
set -g status-right-style "bg=#AACCBB,fg=#4b6357"

# Window status
set -g window-status-style "bg=#e8d5ba,fg=#4b6357"
set -g window-status-current-style "bg=#AACCBB,fg=#63365c"
set -g window-status-activity-style "bg=#AACCBB,fg=#5b5d28"
set -g window-status-bell-style "bg=#AACCBB,fg=#a13b3b"

# Panes
set -g pane-border-style "fg=#4b6357"
set -g pane-active-border-style "fg=#63365c"

# Message
set -g message-style "bg=#AACCBB,fg=#12211a"

# Mode
set -g mode-style "bg=#5b5d28,fg=#e8d5ba"

# Clock
set -g clock-mode-colour "#63365c"

# Copy mode
set -g copy-mode-match-style "bg=#5b5d28,fg=#e8d5ba"
set -g copy-mode-current-match-style "bg=#a13b3b,fg=#e8d5ba"
