# name: BATHORY LIGHT ALT colors for Tmux
# url: https://github.com/tmux/tmux
# upstream: https://github.com/metalelf0/black-metal.nvim/raw/main/extras/tmux/bathory-light-alt.conf
# author: Andrea Schiavini (original code by Casey Miller)

# Color palette
set -g @black   "#eac2b8"
set -g @grey    "#63524b"
set -g @red     "#a13b3b"
set -g @orange  "#813b37"
set -g @green   "#1e1510"
set -g @yellow  "#6e4b2f"
set -g @blue    "#5a552b"
set -g @purple  "#6c4e2c"
set -g @magenta "#8a3c00"
set -g @cyan    "#7f4200"
set -g @white   "#1e1510"

# Theme colors
set -g @theme_bg          "#eac2b8"
set -g @theme_fg          "#1e1510"
set -g @theme_alt_bg      "#eac2b8"
set -g @theme_alt          "#32595c"
set -g @theme_comment      "#63524b"
set -g @theme_visual       "#f2ccb5"
set -g @theme_line         "#eac2b8"

# Status line
set -g status-style "bg=#f2ccb5,fg=#1e1510"
set -g status-left-style "bg=#f2ccb5,fg=#32595c"
set -g status-right-style "bg=#f2ccb5,fg=#63524b"

# Window status
set -g window-status-style "bg=#eac2b8,fg=#63524b"
set -g window-status-current-style "bg=#f2ccb5,fg=#32595c"
set -g window-status-activity-style "bg=#f2ccb5,fg=#813b37"
set -g window-status-bell-style "bg=#f2ccb5,fg=#a13b3b"

# Panes
set -g pane-border-style "fg=#63524b"
set -g pane-active-border-style "fg=#32595c"

# Message
set -g message-style "bg=#f2ccb5,fg=#1e1510"

# Mode
set -g mode-style "bg=#813b37,fg=#eac2b8"

# Clock
set -g clock-mode-colour "#32595c"

# Copy mode
set -g copy-mode-match-style "bg=#813b37,fg=#eac2b8"
set -g copy-mode-current-match-style "bg=#a13b3b,fg=#eac2b8"
