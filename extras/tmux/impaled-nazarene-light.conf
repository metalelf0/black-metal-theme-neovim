# name: IMPALED-NAZARENE LIGHT colors for Tmux
# url: https://github.com/tmux/tmux
# upstream: https://github.com/metalelf0/black-metal.nvim/raw/main/extras/tmux/impaled-nazarene-light.conf
# author: Andrea Schiavini (original code by Casey Miller)

# Color palette
set -g @black   "#dbe7ac"
set -g @grey    "#61664d"
set -g @red     "#a13b3b"
set -g @orange  "#813756"
set -g @green   "#1f2112"
set -g @yellow  "#6e602f"
set -g @blue    "#5c6831"
set -g @purple  "#7b3632"
set -g @magenta "#755f1a"
set -g @cyan    "#c30c03"
set -g @white   "#1f2112"

# Theme colors
set -g @theme_bg          "#edf1d5"
set -g @theme_fg          "#1f2112"
set -g @theme_alt_bg      "#dbe7ac"
set -g @theme_alt          "#365063"
set -g @theme_comment      "#61664d"
set -g @theme_visual       "#e2ebad"
set -g @theme_line         "#edf1d5"

# Status line
set -g status-style "bg=#e2ebad,fg=#1f2112"
set -g status-left-style "bg=#e2ebad,fg=#365063"
set -g status-right-style "bg=#e2ebad,fg=#61664d"

# Window status
set -g window-status-style "bg=#edf1d5,fg=#61664d"
set -g window-status-current-style "bg=#e2ebad,fg=#365063"
set -g window-status-activity-style "bg=#e2ebad,fg=#813756"
set -g window-status-bell-style "bg=#e2ebad,fg=#a13b3b"

# Panes
set -g pane-border-style "fg=#61664d"
set -g pane-active-border-style "fg=#365063"

# Message
set -g message-style "bg=#e2ebad,fg=#1f2112"

# Mode
set -g mode-style "bg=#813756,fg=#edf1d5"

# Clock
set -g clock-mode-colour "#365063"

# Copy mode
set -g copy-mode-match-style "bg=#813756,fg=#edf1d5"
set -g copy-mode-current-match-style "bg=#a13b3b,fg=#edf1d5"
