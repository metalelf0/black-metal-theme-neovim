# name: DARK-FUNERAL LIGHT ALT colors for Tmux
# url: https://github.com/tmux/tmux
# upstream: https://github.com/metalelf0/black-metal.nvim/raw/main/extras/tmux/dark-funeral-light-alt.conf
# author: Andrea Schiavini (original code by Casey Miller)

# Color palette
set -g @black   "#c0cbed"
set -g @grey    "#4f5669"
set -g @red     "#a13b3b"
set -g @orange  "#813b37"
set -g @green   "#121621"
set -g @yellow  "#345779"
set -g @blue    "#3b3d7d"
set -g @purple  "#6c4e2c"
set -g @magenta "#20578e"
set -g @cyan    "#7f4200"
set -g @white   "#121621"

# Theme colors
set -g @theme_bg          "#c0cbed"
set -g @theme_fg          "#121621"
set -g @theme_alt_bg      "#c0cbed"
set -g @theme_alt          "#633d36"
set -g @theme_comment      "#4f5669"
set -g @theme_visual       "#bcccf1"
set -g @theme_line         "#c0cbed"

# Status line
set -g status-style "bg=#bcccf1,fg=#121621"
set -g status-left-style "bg=#bcccf1,fg=#633d36"
set -g status-right-style "bg=#bcccf1,fg=#4f5669"

# Window status
set -g window-status-style "bg=#c0cbed,fg=#4f5669"
set -g window-status-current-style "bg=#bcccf1,fg=#633d36"
set -g window-status-activity-style "bg=#bcccf1,fg=#813b37"
set -g window-status-bell-style "bg=#bcccf1,fg=#a13b3b"

# Panes
set -g pane-border-style "fg=#4f5669"
set -g pane-active-border-style "fg=#633d36"

# Message
set -g message-style "bg=#bcccf1,fg=#121621"

# Mode
set -g mode-style "bg=#813b37,fg=#c0cbed"

# Clock
set -g clock-mode-colour "#633d36"

# Copy mode
set -g copy-mode-match-style "bg=#813b37,fg=#c0cbed"
set -g copy-mode-current-match-style "bg=#a13b3b,fg=#c0cbed"
