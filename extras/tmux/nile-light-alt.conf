# name: NILE LIGHT ALT colors for Tmux
# url: https://github.com/tmux/tmux
# upstream: https://github.com/metalelf0/black-metal.nvim/raw/main/extras/tmux/nile-light-alt.conf
# author: Andrea Schiavini (original code by Casey Miller)

# Color palette
set -g @black   "#e5c4a4"
set -g @grey    "#5d5346"
set -g @red     "#a13b3b"
set -g @orange  "#813a37"
set -g @green   "#17130d"
set -g @yellow  "#555525"
set -g @blue    "#445a2b"
set -g @purple  "#6c4e2c"
set -g @magenta "#565633"
set -g @cyan    "#634f3a"
set -g @white   "#17130d"

# Theme colors
set -g @theme_bg          "#e5c4a4"
set -g @theme_fg          "#17130d"
set -g @theme_alt_bg      "#e5c4a4"
set -g @theme_alt          "#364563"
set -g @theme_comment      "#5d5346"
set -g @theme_visual       "#CBB48C"
set -g @theme_line         "#e5c4a4"

# Status line
set -g status-style "bg=#CBB48C,fg=#17130d"
set -g status-left-style "bg=#CBB48C,fg=#364563"
set -g status-right-style "bg=#CBB48C,fg=#5d5346"

# Window status
set -g window-status-style "bg=#e5c4a4,fg=#5d5346"
set -g window-status-current-style "bg=#CBB48C,fg=#364563"
set -g window-status-activity-style "bg=#CBB48C,fg=#813a37"
set -g window-status-bell-style "bg=#CBB48C,fg=#a13b3b"

# Panes
set -g pane-border-style "fg=#5d5346"
set -g pane-active-border-style "fg=#364563"

# Message
set -g message-style "bg=#CBB48C,fg=#17130d"

# Mode
set -g mode-style "bg=#813a37,fg=#e5c4a4"

# Clock
set -g clock-mode-colour "#364563"

# Copy mode
set -g copy-mode-match-style "bg=#813a37,fg=#e5c4a4"
set -g copy-mode-current-match-style "bg=#a13b3b,fg=#e5c4a4"
