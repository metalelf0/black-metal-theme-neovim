# name: KHOLD LIGHT ALT colors for Tmux
# url: https://github.com/tmux/tmux
# upstream: https://github.com/metalelf0/black-metal.nvim/raw/main/extras/tmux/khold-light-alt.conf
# author: Andrea Schiavini (original code by Casey Miller)

# Color palette
set -g @black   "#e9bec7"
set -g @grey    "#664d52"
set -g @red     "#a13b3b"
set -g @orange  "#615029"
set -g @green   "#1e1013"
set -g @yellow  "#793834"
set -g @blue    "#684e31"
set -g @purple  "#4e5723"
set -g @magenta "#8f342e"
set -g @cyan    "#4f5729"
set -g @white   "#1e1013"

# Theme colors
set -g @theme_bg          "#e9bec7"
set -g @theme_fg          "#1e1013"
set -g @theme_alt_bg      "#e9bec7"
set -g @theme_alt          "#31594e"
set -g @theme_comment      "#664d52"
set -g @theme_visual       "#eebac6"
set -g @theme_line         "#e9bec7"

# Status line
set -g status-style "bg=#eebac6,fg=#1e1013"
set -g status-left-style "bg=#eebac6,fg=#31594e"
set -g status-right-style "bg=#eebac6,fg=#664d52"

# Window status
set -g window-status-style "bg=#e9bec7,fg=#664d52"
set -g window-status-current-style "bg=#eebac6,fg=#31594e"
set -g window-status-activity-style "bg=#eebac6,fg=#615029"
set -g window-status-bell-style "bg=#eebac6,fg=#a13b3b"

# Panes
set -g pane-border-style "fg=#664d52"
set -g pane-active-border-style "fg=#31594e"

# Message
set -g message-style "bg=#eebac6,fg=#1e1013"

# Mode
set -g mode-style "bg=#615029,fg=#e9bec7"

# Clock
set -g clock-mode-colour "#31594e"

# Copy mode
set -g copy-mode-match-style "bg=#615029,fg=#e9bec7"
set -g copy-mode-current-match-style "bg=#a13b3b,fg=#e9bec7"
