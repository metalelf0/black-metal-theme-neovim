# name: VENOM LIGHT ALT colors for Tmux
# url: https://github.com/tmux/tmux
# upstream: https://github.com/metalelf0/black-metal.nvim/raw/main/extras/tmux/venom-light-alt.conf
# author: Andrea Schiavini (original code by Casey Miller)

# Color palette
set -g @black   "#ddcacc"
set -g @grey    "#6c5151"
set -g @red     "#a13b3b"
set -g @orange  "#764b32"
set -g @green   "#211212"
set -g @yellow  "#793534"
set -g @blue    "#6f5034"
set -g @purple  "#5e5526"
set -g @magenta "#ae0200"
set -g @cyan    "#5e5527"
set -g @white   "#211212"

# Theme colors
set -g @theme_bg          "#ddcacc"
set -g @theme_fg          "#211212"
set -g @theme_alt_bg      "#ddcacc"
set -g @theme_alt          "#325c4f"
set -g @theme_comment      "#6c5151"
set -g @theme_visual       "#BAAFAF"
set -g @theme_line         "#ddcacc"

# Status line
set -g status-style "bg=#BAAFAF,fg=#211212"
set -g status-left-style "bg=#BAAFAF,fg=#325c4f"
set -g status-right-style "bg=#BAAFAF,fg=#6c5151"

# Window status
set -g window-status-style "bg=#ddcacc,fg=#6c5151"
set -g window-status-current-style "bg=#BAAFAF,fg=#325c4f"
set -g window-status-activity-style "bg=#BAAFAF,fg=#764b32"
set -g window-status-bell-style "bg=#BAAFAF,fg=#a13b3b"

# Panes
set -g pane-border-style "fg=#6c5151"
set -g pane-active-border-style "fg=#325c4f"

# Message
set -g message-style "bg=#BAAFAF,fg=#211212"

# Mode
set -g mode-style "bg=#764b32,fg=#ddcacc"

# Clock
set -g clock-mode-colour "#325c4f"

# Copy mode
set -g copy-mode-match-style "bg=#764b32,fg=#ddcacc"
set -g copy-mode-current-match-style "bg=#a13b3b,fg=#ddcacc"
