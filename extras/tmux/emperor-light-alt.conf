# name: EMPEROR LIGHT ALT colors for Tmux
# url: https://github.com/tmux/tmux
# upstream: https://github.com/metalelf0/black-metal.nvim/raw/main/extras/tmux/emperor-light-alt.conf
# author: Andrea Schiavini (original code by Casey Miller)

# Color palette
set -g @black   "#cfc1e6"
set -g @grey    "#584f69"
set -g @red     "#a13b3b"
set -g @orange  "#3e3781"
set -g @green   "#15101e"
set -g @yellow  "#3c3479"
set -g @blue    "#613b7d"
set -g @purple  "#5b327b"
set -g @magenta "#4431d4"
set -g @cyan    "#5e486f"
set -g @white   "#15101e"

# Theme colors
set -g @theme_bg          "#cfc1e6"
set -g @theme_fg          "#15101e"
set -g @theme_alt_bg      "#cfc1e6"
set -g @theme_alt          "#595131"
set -g @theme_comment      "#584f69"
set -g @theme_visual       "#d0bee9"
set -g @theme_line         "#cfc1e6"

# Status line
set -g status-style "bg=#d0bee9,fg=#15101e"
set -g status-left-style "bg=#d0bee9,fg=#595131"
set -g status-right-style "bg=#d0bee9,fg=#584f69"

# Window status
set -g window-status-style "bg=#cfc1e6,fg=#584f69"
set -g window-status-current-style "bg=#d0bee9,fg=#595131"
set -g window-status-activity-style "bg=#d0bee9,fg=#3e3781"
set -g window-status-bell-style "bg=#d0bee9,fg=#a13b3b"

# Panes
set -g pane-border-style "fg=#584f69"
set -g pane-active-border-style "fg=#595131"

# Message
set -g message-style "bg=#d0bee9,fg=#15101e"

# Mode
set -g mode-style "bg=#3e3781,fg=#cfc1e6"

# Clock
set -g clock-mode-colour "#595131"

# Copy mode
set -g copy-mode-match-style "bg=#3e3781,fg=#cfc1e6"
set -g copy-mode-current-match-style "bg=#a13b3b,fg=#cfc1e6"
