# name: IMMORTAL LIGHT ALT colors for Tmux
# url: https://github.com/tmux/tmux
# upstream: https://github.com/metalelf0/black-metal.nvim/raw/main/extras/tmux/immortal-light-alt.conf
# author: Andrea Schiavini (original code by Casey Miller)

# Color palette
set -g @black   "#c3d6df"
set -g @grey    "#4d5b66"
set -g @red     "#a13b3b"
set -g @orange  "#2b6264"
set -g @green   "#121b21"
set -g @yellow  "#345779"
set -g @blue    "#3b3e7d"
set -g @purple  "#32577b"
set -g @magenta "#445c73"
set -g @cyan    "#315c87"
set -g @white   "#121b21"

# Theme colors
set -g @theme_bg          "#c3d6df"
set -g @theme_fg          "#121b21"
set -g @theme_alt_bg      "#c3d6df"
set -g @theme_alt          "#633d36"
set -g @theme_comment      "#4d5b66"
set -g @theme_visual       "#A8C2CB"
set -g @theme_line         "#c3d6df"

# Status line
set -g status-style "bg=#A8C2CB,fg=#121b21"
set -g status-left-style "bg=#A8C2CB,fg=#633d36"
set -g status-right-style "bg=#A8C2CB,fg=#4d5b66"

# Window status
set -g window-status-style "bg=#c3d6df,fg=#4d5b66"
set -g window-status-current-style "bg=#A8C2CB,fg=#633d36"
set -g window-status-activity-style "bg=#A8C2CB,fg=#2b6264"
set -g window-status-bell-style "bg=#A8C2CB,fg=#a13b3b"

# Panes
set -g pane-border-style "fg=#4d5b66"
set -g pane-active-border-style "fg=#633d36"

# Message
set -g message-style "bg=#A8C2CB,fg=#121b21"

# Mode
set -g mode-style "bg=#2b6264,fg=#c3d6df"

# Clock
set -g clock-mode-colour "#633d36"

# Copy mode
set -g copy-mode-match-style "bg=#2b6264,fg=#c3d6df"
set -g copy-mode-current-match-style "bg=#a13b3b,fg=#c3d6df"
