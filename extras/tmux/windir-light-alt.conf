# name: WINDIR LIGHT ALT colors for Tmux
# url: https://github.com/tmux/tmux
# upstream: https://github.com/metalelf0/black-metal.nvim/raw/main/extras/tmux/windir-light-alt.conf
# author: Andrea Schiavini (original code by Casey Miller)

# Color palette
set -g @black   "#bfdeb5"
set -g @grey    "#506049"
set -g @red     "#a13b3b"
set -g @orange  "#735431"
set -g @green   "#172112"
set -g @yellow  "#344d79"
set -g @blue    "#423b7d"
set -g @purple  "#5e5e26"
set -g @magenta "#3e5b8e"
set -g @cyan    "#5e5e12"
set -g @white   "#172112"

# Theme colors
set -g @theme_bg          "#bfdeb5"
set -g @theme_fg          "#172112"
set -g @theme_alt_bg      "#bfdeb5"
set -g @theme_alt          "#634436"
set -g @theme_comment      "#506049"
set -g @theme_visual       "#c3e3b0"
set -g @theme_line         "#bfdeb5"

# Status line
set -g status-style "bg=#c3e3b0,fg=#172112"
set -g status-left-style "bg=#c3e3b0,fg=#634436"
set -g status-right-style "bg=#c3e3b0,fg=#506049"

# Window status
set -g window-status-style "bg=#bfdeb5,fg=#506049"
set -g window-status-current-style "bg=#c3e3b0,fg=#634436"
set -g window-status-activity-style "bg=#c3e3b0,fg=#735431"
set -g window-status-bell-style "bg=#c3e3b0,fg=#a13b3b"

# Panes
set -g pane-border-style "fg=#506049"
set -g pane-active-border-style "fg=#634436"

# Message
set -g message-style "bg=#c3e3b0,fg=#172112"

# Mode
set -g mode-style "bg=#735431,fg=#bfdeb5"

# Clock
set -g clock-mode-colour "#634436"

# Copy mode
set -g copy-mode-match-style "bg=#735431,fg=#bfdeb5"
set -g copy-mode-current-match-style "bg=#a13b3b,fg=#bfdeb5"
