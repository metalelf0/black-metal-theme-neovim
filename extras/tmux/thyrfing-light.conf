# name: THYRFING LIGHT colors for Tmux
# url: https://github.com/tmux/tmux
# upstream: https://github.com/metalelf0/black-metal.nvim/raw/main/extras/tmux/thyrfing-light.conf
# author: Andrea Schiavini (original code by Casey Miller)

# Color palette
set -g @black   "#eabbb8"
set -g @grey    "#634e4b"
set -g @red     "#a13b3b"
set -g @orange  "#81374a"
set -g @green   "#170e0d"
set -g @yellow  "#794134"
set -g @blue    "#614f2e"
set -g @purple  "#7b4132"
set -g @magenta "#912f18"
set -g @cyan    "#99270a"
set -g @white   "#170e0d"

# Theme colors
set -g @theme_bg          "#f5dedb"
set -g @theme_fg          "#170e0d"
set -g @theme_alt_bg      "#eabbb8"
set -g @theme_alt          "#2f5651"
set -g @theme_comment      "#634e4b"
set -g @theme_visual       "#efb9b3"
set -g @theme_line         "#f5dedb"

# Status line
set -g status-style "bg=#efb9b3,fg=#170e0d"
set -g status-left-style "bg=#efb9b3,fg=#2f5651"
set -g status-right-style "bg=#efb9b3,fg=#634e4b"

# Window status
set -g window-status-style "bg=#f5dedb,fg=#634e4b"
set -g window-status-current-style "bg=#efb9b3,fg=#2f5651"
set -g window-status-activity-style "bg=#efb9b3,fg=#81374a"
set -g window-status-bell-style "bg=#efb9b3,fg=#a13b3b"

# Panes
set -g pane-border-style "fg=#634e4b"
set -g pane-active-border-style "fg=#2f5651"

# Message
set -g message-style "bg=#efb9b3,fg=#170e0d"

# Mode
set -g mode-style "bg=#81374a,fg=#f5dedb"

# Clock
set -g clock-mode-colour "#2f5651"

# Copy mode
set -g copy-mode-match-style "bg=#81374a,fg=#f5dedb"
set -g copy-mode-current-match-style "bg=#a13b3b,fg=#f5dedb"
