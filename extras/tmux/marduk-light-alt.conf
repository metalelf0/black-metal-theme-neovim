# name: MARDUK LIGHT ALT colors for Tmux
# url: https://github.com/tmux/tmux
# upstream: https://github.com/metalelf0/black-metal.nvim/raw/main/extras/tmux/marduk-light-alt.conf
# author: Andrea Schiavini (original code by Casey Miller)

# Color palette
set -g @black   "#bbd3d1"
set -g @grey    "#445a58"
set -g @red     "#a13b3b"
set -g @orange  "#2f6129"
set -g @green   "#0e1a19"
set -g @yellow  "#296047"
set -g @blue    "#2c5e5d"
set -g @purple  "#265e3c"
set -g @magenta "#495b52"
set -g @cyan    "#4b5950"
set -g @white   "#0e1a19"

# Theme colors
set -g @theme_bg          "#bbd3d1"
set -g @theme_fg          "#0e1a19"
set -g @theme_alt_bg      "#bbd3d1"
set -g @theme_alt          "#63365b"
set -g @theme_comment      "#445a58"
set -g @theme_visual       "#ABC0BC"
set -g @theme_line         "#bbd3d1"

# Status line
set -g status-style "bg=#ABC0BC,fg=#0e1a19"
set -g status-left-style "bg=#ABC0BC,fg=#63365b"
set -g status-right-style "bg=#ABC0BC,fg=#445a58"

# Window status
set -g window-status-style "bg=#bbd3d1,fg=#445a58"
set -g window-status-current-style "bg=#ABC0BC,fg=#63365b"
set -g window-status-activity-style "bg=#ABC0BC,fg=#2f6129"
set -g window-status-bell-style "bg=#ABC0BC,fg=#a13b3b"

# Panes
set -g pane-border-style "fg=#445a58"
set -g pane-active-border-style "fg=#63365b"

# Message
set -g message-style "bg=#ABC0BC,fg=#0e1a19"

# Mode
set -g mode-style "bg=#2f6129,fg=#bbd3d1"

# Clock
set -g clock-mode-colour "#63365b"

# Copy mode
set -g copy-mode-match-style "bg=#2f6129,fg=#bbd3d1"
set -g copy-mode-current-match-style "bg=#a13b3b,fg=#bbd3d1"
