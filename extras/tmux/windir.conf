# name: WINDIR colors for Tmux
# url: https://github.com/tmux/tmux
# upstream: https://github.com/metalelf0/black-metal.nvim/raw/main/extras/tmux/windir.conf
# author: Andrea Schiavini (original code by Casey Miller)

# Color palette
set -g @black   "#181c15"
set -g @grey    "#505050"
set -g @red     "#5f8787"
set -g @orange  "#aaaaaa"
set -g @green   "#c1c1c1"
set -g @yellow  "#888888"
set -g @blue    "#aaaaaa"
set -g @purple  "#999999"
set -g @magenta "#5E77A3"
set -g @cyan    "#D9D98E"
set -g @white   "#c1c1c1"

# Theme colors
set -g @theme_bg          "#000000"
set -g @theme_fg          "#c1c1c1"
set -g @theme_alt_bg      "#181c15"
set -g @theme_alt          "#5f8787"
set -g @theme_comment      "#505050"
set -g @theme_visual       "#222222"
set -g @theme_line         "#000000"

# Status line
set -g status-style "bg=#222222,fg=#c1c1c1"
set -g status-left-style "bg=#222222,fg=#5f8787"
set -g status-right-style "bg=#222222,fg=#505050"

# Window status
set -g window-status-style "bg=#000000,fg=#505050"
set -g window-status-current-style "bg=#222222,fg=#5f8787"
set -g window-status-activity-style "bg=#222222,fg=#aaaaaa"
set -g window-status-bell-style "bg=#222222,fg=#5f8787"

# Panes
set -g pane-border-style "fg=#505050"
set -g pane-active-border-style "fg=#5f8787"

# Message
set -g message-style "bg=#222222,fg=#c1c1c1"

# Mode
set -g mode-style "bg=#aaaaaa,fg=#000000"

# Clock
set -g clock-mode-colour "#5f8787"

# Copy mode
set -g copy-mode-match-style "bg=#aaaaaa,fg=#000000"
set -g copy-mode-current-match-style "bg=#5f8787,fg=#000000"
