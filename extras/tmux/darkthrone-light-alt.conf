# name: DARKTHRONE LIGHT ALT colors for Tmux
# url: https://github.com/tmux/tmux
# upstream: https://github.com/metalelf0/black-metal.nvim/raw/main/extras/tmux/darkthrone-light-alt.conf
# author: Andrea Schiavini (original code by Casey Miller)

# Color palette
set -g @black   "#f2f2f0"
set -g @grey    "#6a6a6a"
set -g @red     "#a13b3b"
set -g @orange  "#5e5e5e"
set -g @green   "#1a1a1a"
set -g @yellow  "#555555"
set -g @blue    "#5e5e5e"
set -g @purple  "#4a4a4a"
set -g @magenta "#000000"
set -g @cyan    "#000000"
set -g @white   "#1a1a1a"

# Theme colors
set -g @theme_bg          "#f2f2f0"
set -g @theme_fg          "#1a1a1a"
set -g @theme_alt_bg      "#f2f2f0"
set -g @theme_alt          "#444444"
set -g @theme_comment      "#6a6a6a"
set -g @theme_visual       "#d9d9d6"
set -g @theme_line         "#f2f2f0"

# Status line
set -g status-style "bg=#d9d9d6,fg=#1a1a1a"
set -g status-left-style "bg=#d9d9d6,fg=#444444"
set -g status-right-style "bg=#d9d9d6,fg=#6a6a6a"

# Window status
set -g window-status-style "bg=#f2f2f0,fg=#6a6a6a"
set -g window-status-current-style "bg=#d9d9d6,fg=#444444"
set -g window-status-activity-style "bg=#d9d9d6,fg=#5e5e5e"
set -g window-status-bell-style "bg=#d9d9d6,fg=#a13b3b"

# Panes
set -g pane-border-style "fg=#6a6a6a"
set -g pane-active-border-style "fg=#444444"

# Message
set -g message-style "bg=#d9d9d6,fg=#1a1a1a"

# Mode
set -g mode-style "bg=#5e5e5e,fg=#f2f2f0"

# Clock
set -g clock-mode-colour "#444444"

# Copy mode
set -g copy-mode-match-style "bg=#5e5e5e,fg=#f2f2f0"
set -g copy-mode-current-match-style "bg=#a13b3b,fg=#f2f2f0"
