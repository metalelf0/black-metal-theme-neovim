# name: BATHORY ALT colors for Tmux
# url: https://github.com/tmux/tmux
# upstream: https://github.com/metalelf0/black-metal.nvim/raw/main/extras/tmux/bathory-alt.conf
# author: Andrea Schiavini (original code by Casey Miller)

# Color palette
set -g @black   "#3E2018"
set -g @grey    "#505050"
set -g @red     "#5f8787"
set -g @orange  "#aaaaaa"
set -g @green   "#c1c1c1"
set -g @yellow  "#888888"
set -g @blue    "#aaaaaa"
set -g @purple  "#999999"
set -g @magenta "#e78a43"
set -g @cyan    "#fbcb97"
set -g @white   "#f1f1f1"

# Theme colors
set -g @theme_bg          "#3E2018"
set -g @theme_fg          "#f1f1f1"
set -g @theme_alt_bg      "#3E2018"
set -g @theme_alt          "#5f8787"
set -g @theme_comment      "#505050"
set -g @theme_visual       "#474747"
set -g @theme_line         "#3E2018"

# Status line
set -g status-style "bg=#474747,fg=#f1f1f1"
set -g status-left-style "bg=#474747,fg=#5f8787"
set -g status-right-style "bg=#474747,fg=#505050"

# Window status
set -g window-status-style "bg=#3E2018,fg=#505050"
set -g window-status-current-style "bg=#474747,fg=#5f8787"
set -g window-status-activity-style "bg=#474747,fg=#aaaaaa"
set -g window-status-bell-style "bg=#474747,fg=#5f8787"

# Panes
set -g pane-border-style "fg=#505050"
set -g pane-active-border-style "fg=#5f8787"

# Message
set -g message-style "bg=#474747,fg=#f1f1f1"

# Mode
set -g mode-style "bg=#aaaaaa,fg=#3E2018"

# Clock
set -g clock-mode-colour "#5f8787"

# Copy mode
set -g copy-mode-match-style "bg=#aaaaaa,fg=#3E2018"
set -g copy-mode-current-match-style "bg=#5f8787,fg=#3E2018"
