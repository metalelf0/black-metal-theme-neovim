# name: TAAKE ALT colors for Yazi
# url: https://github.com/sxyazi/yazi
# upstream: https://github.com/metalelf0/black-metal.nvim/raw/main/extras/yazi/taake-alt.toml
# author: Andrea Schiavini (original code by Casey Miller)

[manager]
cwd = { fg = "#888888" }

hovered         = { fg = "#c1c1c1", bg = "#403035" }
preview_hovered = { fg = "#c1c1c1", bg = "#403035" }

find_keyword  = { fg = "#5f8787", italic = true }
find_position = { fg = "#5f8787", bg = "reset", italic = true }

marker_copied   = { fg = "#a29884" }
marker_cut      = { fg = "#5f8787" }
marker_selected = { fg = "#5f8787" }

tab_active   = { fg = "#5f8787", bg = "#545454" }
tab_inactive = { fg = "#505050", bg = "#545454" }
tab_width    = 1

count_cut      = { fg = "#5f8787", bg = "#403035" }
count_copied   = { fg = "#5f8787", bg = "#403035" }
count_selected = { fg = "#5f8787", bg = "#403035" }

border_symbol = "│"
border_style  = { fg = "#505050" }

[mode]
normal_main   = { fg = "#403035", bg = "#aaaaaa", bold = true }
normal_alt    = { fg = "#403035", bg = "#aaaaaa", bold = true }
select_main   = { fg = "#403035", bg = "#999999", bold = true }
select_alt    = { fg = "#403035", bg = "#999999", bold = true }
unset_main    = { fg = "#403035", bg = "#a29884", bold = true }
unset_alt     = { fg = "#403035", bg = "#a29884", bold = true }

[status]
separator_open  = ""
separator_close = ""
separator_style = { fg = "#545454", bg = "#545454" }

progress_label  = { fg = "#5f8787", bold = true }
progress_normal = { fg = "#5f8787", bg = "#545454" }
progress_error  = { fg = "#403035", bg = "#5f8787" }

permissions_t = { fg = "#f1f1f1" }
permissions_r = { fg = "#888888" }
permissions_w = { fg = "#5f8787" }
permissions_x = { fg = "#aaaaaa" }
permissions_s = { fg = "#9b99a3" }

[input]
border   = { fg = "#505050" }
title    = {}
value    = {}
selected = { reversed = true }

[select]
border   = { fg = "#505050" }
active   = { fg = "#999999" }
inactive = {}

[tasks]
border  = { fg = "#505050" }
title   = {}
hovered = { underline = true }

[which]
mask            = { bg = "#3A2B30" }
cand            = { fg = "#c1c1c1" }
rest            = { fg = "#83756a" }
desc            = { fg = "#a29884" }
separator       = "  "
separator_style = { fg = "#9b99a3"}

[help]
on      = { fg = "#83756a" }
run    = { fg = "#a29884" }
desc    = { fg = "#505050" }
hovered = { fg = "#c1c1c1", bg = "#403035", bold = true }
footer  = { fg = "#505050", bg = "#403035" }

[filetype]
rules = [
# Media
{ mime = "image/*", fg = "#83756a"},
{ mime = "{audio,video}/*", fg = "#a29884"},

# Archives
{ mime = "application/{,g}zip", fg = "#5f8787"},
{ mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", fg = "#5f8787"},

# Fallback
{ name = "*", fg = "#f1f1f1"},
{ name = "*/", fg = "#888888"}
]
  